<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мои оценки</title>
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="../../shared/fonts.css">
<style>
:root{
  --bg:#08080a;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.13);--stroke:rgba(255,255,255,.18);
  --text:#f6f6f8;--muted:rgba(236,236,244,.74);--faint:rgba(236,236,244,.5);
  --g5:#22c55e;--g5b:#86efac;--g4:#3b82f6;--g4b:#93c5fd;--g3:#f59e0b;--g3b:#fcd34d;--g2:#ef4444;--g2b:#fca5a5;
  --acc:#e6c97f;--acc2:#9c7731;--gold:#d6b15e;--gold-hi:#f3e3b0;
  --gold-grad:linear-gradient(100deg,#f3e3b0,#d6b15e 40%,#9c7731 75%,#e6c97f);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:radial-gradient(120% 80% at 50% -20%,#1b1a1f 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-weight:600;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
img.ai{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.ii{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em}
.ii img.ai{width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* фон */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:340px;height:340px;background:#d6b15e;opacity:.2;top:-120px;left:-100px;animation:fl1 16s ease-in-out infinite}
.b2{width:300px;height:300px;background:#fff;opacity:.06;top:30%;right:-140px;animation:fl2 19s ease-in-out infinite}
.b3{width:320px;height:320px;background:#9c7731;opacity:.2;bottom:-140px;left:-60px;animation:fl3 22s ease-in-out infinite}
@keyframes fl1{50%{transform:translate(80px,120px) scale(1.15)}}
@keyframes fl2{50%{transform:translate(-90px,-60px) scale(.9)}}
@keyframes fl3{50%{transform:translate(100px,-90px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none!important}}

#app{position:relative;z-index:1;min-height:100vh}
.screen{padding:calc(16px + var(--sat)) 16px calc(230px + var(--sab));animation:enter .45s cubic-bezier(.2,.9,.25,1) both;max-width:560px;margin:0 auto}
.screen.home{padding-bottom:calc(40px + var(--sab))}
.screen.fromleft{animation-name:enterL}
@keyframes enter{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes enterL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .35s cubic-bezier(.2,.9,.25,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}

.glass{position:relative;isolation:isolate;background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 45%,rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-radius:24px;backdrop-filter:blur(22px) saturate(185%);-webkit-backdrop-filter:blur(22px) saturate(185%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px -34px rgba(0,0,0,.7)}
.glass:not(.hero)::after{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(160deg,rgba(214,177,94,.11),transparent 45%)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hello{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.title{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.5px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.title.sm{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tico{width:40px;height:40px;flex:none}
.icon-btn{width:48px;height:48px;border-radius:16px;background:var(--glass2);border:1px solid var(--stroke);font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .15s}
.icon-btn .ii{width:28px;height:28px}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{transform:scale(.88)}
.ml{margin-left:auto}

/* переключатель вида */
.views{display:flex;gap:4px;padding:4px;border-radius:18px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);margin:0 0 12px}
.views button{flex:1;min-height:42px;border-radius:14px;font-weight:800;font-size:14px;color:var(--muted);transition:background .25s,color .25s}
.views button.on{background:var(--gold-grad);color:#17130b;box-shadow:0 6px 16px -8px rgba(214,177,94,.8)}

.month{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 16px}
.month button{width:44px;height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-size:20px;transition:transform .15s;display:flex;align-items:center;justify-content:center}
.month button:active{transform:scale(.85)}
.month button:disabled{opacity:.3}
.month .ml-l{min-width:170px;text-align:center;padding:6px 14px;border-radius:14px;background:var(--glass)}
.month .ml-l b{display:block;font-size:15px;font-weight:800}
.month .ml-l small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}

/* главная карточка */
.hero{padding:20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(243,227,176,.75),rgba(156,119,49,.35),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .bar{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.25,1),stroke .4s}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-1px}
.ring .cap{font-size:11px;color:var(--muted);margin-top:-2px;text-align:center;max-width:80%}
.status{font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:6px}
.status .ii{width:26px;height:26px;flex:none}
.status-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:20px}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px;font-weight:700;font-size:15px;color:var(--muted)}
.sec span:last-child{font-size:13px;text-align:right}

/* серия */
.streak{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:12px}
.streak .sico{width:52px;height:52px;flex:none;animation:bob 2.8s ease-in-out infinite}
.streak .sn{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--gold-hi)}
.streak .st{font-size:13px;color:var(--muted);line-height:1.35}
.streak .sb{margin-left:auto;text-align:center;font-size:11px;color:var(--muted);flex:none}
.streak .sb b{display:block;font-size:16px;color:var(--text)}

/* карточки предметов */
.subj{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;transition:transform .15s,background .2s;animation:rise .5s cubic-bezier(.2,.9,.25,1) both;width:100%;text-align:left}
.subj:active{transform:scale(.97);background:var(--glass2)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.emo{width:50px;height:50px;border-radius:16px;background:var(--glass2);display:flex;align-items:center;justify-content:center;flex:none;padding:6px}
.subj .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:nowrap;overflow:hidden}
.dot{width:20px;height:20px;border-radius:7px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.nomarks{font-size:13px;color:var(--muted);margin-top:4px}
.gbadge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--gold-hi);background:rgba(214,177,94,.14);border-radius:10px;padding:2px 7px;margin-top:6px}
.gbadge .ii{width:14px;height:14px}
.grade{width:48px;height:48px;border-radius:16px;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto}
.sub-avg{font-size:11px;text-align:center;color:var(--muted);margin-top:3px}

.c5{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;box-shadow:0 6px 20px -6px rgba(34,197,94,.7)}
.c4{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 6px 20px -6px rgba(59,130,246,.7)}
.c3{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff;box-shadow:0 6px 20px -6px rgba(245,158,11,.7)}
.c2{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 6px 20px -6px rgba(239,68,68,.7)}
.c0{background:var(--glass2);color:var(--muted)}
.t5{color:var(--g5b)}.t4{color:var(--g4b)}.t3{color:var(--g3b)}.t2{color:var(--g2b)}
.dot.c5,.dot.c4,.dot.c3,.dot.c2{box-shadow:none}

.add-card{width:100%;min-height:56px;padding:16px;border-radius:20px;border:1.5px dashed rgba(255,255,255,.22);color:var(--muted);font-weight:700;font-size:15px;margin-top:4px;transition:transform .15s}
.add-card:active{transform:scale(.97)}

/* таблица года */
.yt{padding:8px 10px}
.yr{display:grid;grid-template-columns:34px minmax(0,1fr) repeat(4,30px) 40px;gap:6px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);width:100%;text-align:left}
.yr:last-child{border-bottom:0}
.yr.hd{font-size:11px;color:var(--muted);font-weight:800;padding-top:4px;padding-bottom:4px}
.yr.hd span{text-align:center}
.yr .yi{width:34px;height:34px}
.yr .yn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc{width:30px;height:30px;border-radius:10px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:none!important}
.qc.yg{width:40px;height:40px;border-radius:13px;font-size:18px}
.qc.cur{outline:2px solid rgba(243,227,176,.7);outline-offset:1px}
.yr:active{background:rgba(255,255,255,.04)}

/* график */
.chartbox{padding:16px 14px 12px;margin-top:12px}
.chartbox h3{margin:0 4px 2px;font-size:16px;display:flex;align-items:center;gap:8px}
.chartbox h3 .ii{width:24px;height:24px}
.chartbox .hint{margin:0 4px 6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:rgba(255,255,255,.08);stroke-width:1}
.chart .gl.t{stroke:rgba(255,255,255,.14);stroke-dasharray:3 4}
.chart .yl,.chart .xl{fill:var(--faint);font-size:11px;font-family:Manrope,system-ui,sans-serif;font-weight:700}
.chart .xl.cur{fill:var(--text)}
.chart .ln{fill:none;stroke:url(#lg);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .15s cubic-bezier(.4,.1,.2,1) forwards}
.chart .area{fill:url(#ag);opacity:0;animation:fade2 .8s .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade2{to{opacity:1}}
.chart .mk{fill:#f3e3b0;stroke:#0d0d10;stroke-width:2.5;transition:r .2s}
.chart .mk.on{r:7}
.chart .dl{fill:var(--text);font-size:12px;font-weight:800;font-family:Manrope,system-ui,sans-serif}
.chart .cur-l{stroke:rgba(243,227,176,.45);stroke-width:1;opacity:0;transition:opacity .2s}
.chart .hit{fill:transparent;cursor:pointer}
.ctip{position:absolute;top:0;transform:translate(-50%,0);background:rgba(18,18,22,.96);border:1px solid var(--stroke);border-radius:12px;padding:6px 10px;font-size:12px;line-height:1.3;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.ctip.on{opacity:1}
.ctip b{font-size:13px}
.chart-empty{display:flex;align-items:center;gap:12px;padding:10px 4px 6px;font-size:13px;color:var(--muted);line-height:1.4}
.chart-empty .ii{width:44px;height:44px;flex:none}

/* пустой экран */
.empty{text-align:center;padding:30px 22px}
.empty .big{width:110px;height:110px;margin:0 auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.empty h2{margin:12px 0 6px;font-size:22px;font-family:var(--f-display)}
.empty p{color:var(--muted);margin:0 0 20px;line-height:1.45;font-size:15px}
.mini-empty{display:flex;align-items:center;gap:12px;padding:16px;font-size:14px;color:var(--muted);line-height:1.4}
.mini-empty .ii{width:46px;height:46px;flex:none}
.cta{display:block;width:100%;min-height:54px;padding:16px;border-radius:999px;font-weight:800;font-size:16px;color:#17130b;background:var(--gold-grad);box-shadow:0 10px 26px -12px rgba(214,177,94,.7);transition:transform .15s}
.cta:active{transform:scale(.96)}
.cta.ghost{background:var(--glass2);color:var(--text);box-shadow:none;margin-top:10px;border:1px solid var(--stroke)}
.cta:disabled{opacity:.5}

/* экран предмета */
.big-hero{padding:22px 18px;text-align:center;position:relative}
.big-hero .ring{margin:0 auto}
.big-hero .val{font-size:56px}
.big-hero .cap{font-size:13px}
.avgline{margin-top:12px;font-size:15px;color:var(--muted)}
.avgline b{color:var(--text);font-size:17px}
.ghost-note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:12px;background:rgba(214,177,94,.18);color:var(--gold-hi)}
.ghost-note .ii{width:18px;height:18px}

.goal{padding:18px;margin-top:12px}
.goal-head{display:flex;align-items:center;gap:8px}
.goal-head .lbl{font-weight:800;font-size:16px;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.goal-head .lbl .ii{width:26px;height:26px;flex:none}
.goal-head.wrap{flex-wrap:wrap}.goal-head.wrap .tabs{width:100%;margin-top:10px}.goal-head.wrap .tabs button{flex:1}
.goal-head .lbl small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tabs{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:3px;flex:none}
.tabs button{min-width:42px;height:40px;border-radius:11px;font-weight:900;font-size:15px;color:var(--muted);transition:all .25s;padding:0 6px}
.tabs button.on{color:#fff}
.tabs button.on.k5{background:var(--g5)}.tabs button.on.k4{background:var(--g4)}.tabs button.on.k3{background:#d97706}.tabs button.on.k0{background:rgba(255,255,255,.18)}
.tabs button.k0{font-size:12px;font-weight:800}
.goal-msg{font-size:16px;line-height:1.4;margin-top:14px;font-weight:600}
.goal-msg .n{font-size:28px;font-weight:900;vertical-align:-3px;margin:0 2px}
.goal-soft{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.slot{width:40px;height:40px;border-radius:13px;border:2px dashed rgba(134,239,172,.55);color:rgba(134,239,172,.85);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;animation:slotIn .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slotIn{from{opacity:0;transform:scale(.3)}}
.slot.more{border-style:solid;font-size:13px;width:auto;padding:0 10px}
.goal-done{display:flex;align-items:center;gap:12px;margin-top:12px}
.goal-done .em{width:52px;height:52px;flex:none;animation:bob 2.2s ease-in-out infinite}
.goal-done .tx{font-size:15px;line-height:1.4}
.goal-done .tx b{font-size:16px}
.pbar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1s cubic-bezier(.2,.9,.25,1)}

.qrow{display:grid;grid-template-columns:repeat(4,1fr) 1.15fr;gap:8px;margin-top:12px}
.qcell{border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);padding:10px 4px;text-align:center}
.qcell.cur{border-color:rgba(243,227,176,.55)}
.qcell small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.qcell .qg{width:36px;height:36px;border-radius:12px;margin:6px auto 4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:none!important}
.qcell.yr2 .qg{width:42px;height:42px;font-size:21px}
.qcell .qa{font-size:11px;color:var(--muted)}

.marks-box{padding:18px;margin-top:12px}
.marks-box h3{margin:0 0 4px;font-size:16px}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.chip{width:50px;height:50px;border-radius:15px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.chip:active{transform:scale(.85)}
.chip.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
.chip.ghost{background:transparent!important;box-shadow:none!important;border:2px dashed currentColor}
.chip.ghost.c5{color:var(--g5b)}.chip.ghost.c4{color:var(--g4b)}.chip.ghost.c3{color:var(--g3b)}.chip.ghost.c2{color:var(--g2b)}
.chip.out{animation:out .3s ease-in both}
@keyframes out{to{transform:scale(0) rotate(30deg);opacity:0}}

/* док с кнопками */
.dock{position:fixed;left:10px;right:10px;bottom:calc(12px + var(--sab));z-index:10;padding:12px;border-radius:28px;background:rgba(14,14,17,.8);border:1px solid var(--stroke);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 -10px 40px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);animation:dockIn .5s cubic-bezier(.2,.9,.25,1) both;max-width:540px;margin:0 auto}
@keyframes dockIn{from{transform:translateY(120%)}}
.dock-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 4px}
.wi{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;min-height:44px}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.18);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.sw.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}.sw.on::after{transform:translateX(18px)}
.dock-hint{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.reset{font-size:14px;font-weight:800;min-height:40px;padding:0 14px;border-radius:12px;background:var(--glass2);margin-left:auto}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:74px;border-radius:22px;font-size:34px;font-weight:900;position:relative;overflow:hidden;transition:transform .12s}
.key:active{transform:scale(.88)}
.key.wi-on{background:transparent!important;border:2px dashed rgba(255,255,255,.4);box-shadow:none!important}
.key.wi-on.c5{color:var(--g5b)}.key.wi-on.c4{color:var(--g4b)}.key.wi-on.c3{color:var(--g3b)}.key.wi-on.c2{color:var(--g2b)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}

var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

/* [название, эмодзи (хранится в данных как раньше), 3D-картинка] */

function findSubj(n){var l=n.toLowerCase().trim();for(var i=0;i<SUBJ.length;i++)if(SUBJ[i][0].toLowerCase()===l)return SUBJ[i];return null;}
function emojiFor(n){var f=findSubj(n);if(f)return f[1];var l=n.toLowerCase().trim();
  for(var j=0;j<PREFIX.length;j++){if(l.indexOf(PREFIX[j][0])===0)return PREFIX[j][1];}return '📘';}
function artFor(s){var f=findSubj(s.name);if(f)return f[2];
  var e=emojiFor(s.name);if(e!=='📘')return EMO_ART[e];return EMO_ART[s.e]||'book';}
function ai(n){return '<img class="ai" src="art/'+n+'.webp" alt="" draggable="false">';}

/* ---------- данные ---------- */
var DEF_Q=[['09-01','10-26'],['11-05','12-28'],['01-09','03-22'],['04-01','05-26']];
function defCfg(){return {t5:4.5,t4:3.5,t3:2.5};}
function normalize(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.subjects))s={subjects:[],cfg:{}};
  if(!s.cfg||typeof s.cfg!=='object')s.cfg={};
  var d=defCfg();for(var k in d)if(typeof s.cfg[k]!=='number'||isNaN(s.cfg[k]))s.cfg[k]=d[k];
  if(!okQ(s.cfg.q))s.cfg.q=JSON.parse(JSON.stringify(DEF_Q));
  s.subjects=s.subjects.filter(function(x){return x&&typeof x.name==='string'&&x.name.trim();});
  s.subjects.forEach(function(x){
    if(!x.id)x.id=uid();x.id=String(x.id);
    if(!x.e)x.e=emojiFor(x.name);
    if(!Array.isArray(x.marks))x.marks=[];
    x.marks=x.marks.filter(function(m){return m&&[2,3,4,5].indexOf(+m.v)>=0&&/^\d{4}-\d\d-\d\d$/.test(m.d);});
    x.marks.forEach(function(m){m.v=+m.v;if(!m.id)m.id=uid();});
    if(x.goals&&typeof x.goals!=='object')delete x.goals;
  });
  return s;
}
function okQ(q){if(!Array.isArray(q)||q.length!==4)return false;
  for(var i=0;i<4;i++){if(!Array.isArray(q[i])||!/^\d\d-\d\d$/.test(q[i][0])||!/^\d\d-\d\d$/.test(q[i][1]))return false;}return true;}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}return normalize(s);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function p2(n){return(n<10?'0':'')+n;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var now=new Date();

var ui={y:now.getFullYear(),m:now.getMonth(),goal:{},wi:false,ghost:[],popId:null,dir:'',view:(['m','q','y'].indexOf(uiSaved.view)>=0?uiSaved.view:'m')};
var tq=qOf(todayStr());ui.qy=tq.y;ui.qq=tq.q;ui.sy=tq.y;

/* ---------- четверти ---------- */
/* учебный год Y: 1–2 четверть в году Y, 3–4 — в Y+1 (по месяцу начала) */
function qStart(Y,i){var md=st.cfg.q[i][0];return (+md.slice(0,2)>=8?Y:Y+1)+'-'+md;}
function qEnd(Y,i){var md=st.cfg.q[i][1];return (+md.slice(0,2)>=8?Y:Y+1)+'-'+md;}
var qMemo;
function qOf(d){qMemo=qMemo||{};var key=d+'|'+st.cfg.q.join();if(qMemo[key])return qMemo[key];
  var Y=+d.slice(0,4);if(d<qStart(Y,0))Y--;
  var q=0;for(var i=3;i>=0;i--){if(d>=qStart(Y,i)){q=i;break;}}
  /* каникулы и лето относятся к предыдущей четверти */
  return (qMemo[key]={y:Y,q:q});}
function qKey(y,q){return y+'-'+q;}

/* ---------- математика ---------- */
function r2(x){return Math.round(x*100)/100;}
function avg(v){if(!v.length)return null;var s=0;v.forEach(function(x){s+=x;});return s/v.length;}

/* сколько пятёрок добавить, чтобы средний >= target */
function needFives(v,target){var s=0,n=v.length;v.forEach(function(x){s+=x;});
  for(var k=0;k<400;k++){if(n&&r2(s/n)>=target)return k;s+=5;n++;}return Infinity;}
/* сколько оценок v можно получить, оставаясь >= target */
function afford(v,target,x){var s=0,n=v.length;v.forEach(function(y){s+=y;});if(!n||r2(s/n)<target)return 0;
  for(var k=0;k<99;k++){s+=x;n++;if(r2(s/n)<target)return k;}return 99;}
function plural(n,a,b,c){var m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<12||h>14))return b;return c;}

function w(v,n,acc){return (acc?WORDS_ACC:WORDS)[v][plural(n,0,1,2)];}
function nTxt(n){return n===Infinity?'очень много':String(n);}

function inMonth(mk){return +mk.d.slice(0,4)===ui.y&&+mk.d.slice(5,7)-1===ui.m;}
function realMarks(s){return s.marks.filter(inMonth);}

function qMarks(s,y,q){return s.marks.filter(function(m){var o=qOf(m.d);return o.y===y&&o.q===q;}).map(function(m){return m.v;});}

/* годовая — по четвертным оценкам */
function yearGrade(qs){var g=qs.filter(function(x){return x.g;}).map(function(x){return x.g;});var a=avg(g);return {a:a,g:grade(a),n:g.length};}
function monthSeries(list,Y){var pts=[];for(var k=0;k<9;k++){var m=(8+k)%12,y=k<4?Y:Y+1,v=[];
    list.forEach(function(s){s.marks.forEach(function(mk){if(+mk.d.slice(0,4)===y&&+mk.d.slice(5,7)-1===m)v.push(mk.v);});});
    pts.push({m:m,y:y,v:avg(v),n:v.length});}return pts;}

function allMarksSorted(){var a=[];st.subjects.forEach(function(s){s.marks.forEach(function(m){a.push(m);});});

/* ---------- кольцо ---------- */
var ringPrev={};
var RING_DEFS='<defs>'+[[5,'#86efac','#16a34a'],[4,'#93c5fd','#2563eb'],[3,'#fde68a','#d97706'],[2,'#fca5a5','#dc2626']].map(function(a){return '<linearGradient id="gr'+a[0]+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a[1]+'"/><stop offset="1" stop-color="'+a[2]+'"/></linearGradient>';}).join('')+'</defs>';
function ring(key,size,stroke,value,g,label,cap,aria){
  var r=(size-stroke)/2,c=2*Math.PI*r,frac=value===null?0:Math.max(0,Math.min(1,(value-1)/4));
  var col={5:'url(#gr5)',4:'url(#gr4)',3:'url(#gr3)',2:'url(#gr2)',0:'rgba(255,255,255,.15)'}[g];
  var prev=ringPrev[key]===undefined?0:ringPrev[key];ringPrev[key]=frac;
  return '<div class="ring" role="img" aria-label="'+esc(aria||'')+'" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" aria-hidden="true">'+RING_DEFS+
   '<circle class="track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="'+stroke+'"/>'+
   '<circle class="bar" data-to="'+(c*(1-frac))+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-prev))+'"/>'+
   '</svg><div class="inner" aria-hidden="true"><div class="val '+(g?'t'+g:'')+'">'+label+'</div><div class="cap">'+cap+'</div></div></div>';
}
function animateRings(){requestAnimationFrame(function(){requestAnimationFrame(function(){
  document.querySelectorAll('circle.bar').forEach(function(el){el.style.strokeDashoffset=el.getAttribute('data-to');});
  document.querySelectorAll('.pbar i[data-w]').forEach(function(el){el.style.width=el.getAttribute('data-w')+'%';});
});});
  document.querySelectorAll('[data-count]').forEach(function(el){
    var to=parseFloat(el.getAttribute('data-count')),from=parseFloat(el.getAttribute('data-from')||0),t0=performance.now();
    (function step(t){var k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3),v=from+(to-from)*e;el.textContent=v.toFixed(2).replace('.',',');if(k<1)requestAnimationFrame(step);})(t0);
  });
}

/* ---------- график динамики ---------- */
var charts={},chartN=0;
function chart(pts,title){
  var have=pts.filter(function(p){return p.v!==null;});
  if(have.length<2)return '<div class="chart-empty">'+ii('chart')+'<span>'+(have.length?'Ещё месяц с оценками — и здесь появится линия.':'Здесь появится график, когда будут оценки хотя бы за два месяца.')+'</span></div>';
  var id='c'+(chartN++);charts[id]=pts;
  var W=340,H=168,L=26,R=12,T=18,B=26,iw=W-L-R,ih=H-T-B,n=pts.length;
  function X(i){return L+iw*(i+.5)/n;}

  if(cnt[2])return ['thinking','Есть над чем поработать',cnt[2]+' '+plural(cnt[2],'предмет пока выходит','предмета пока выходят','предметов пока выходят')+' на «2». Открой — покажу, как исправить.'];
  return ['rocket','Можно ещё лучше',cnt[3]+' '+plural(cnt[3],'предмет','предмета','предметов')+' на «3». Пара пятёрок всё исправит.'];
}
function heroCard(key,gs,cnt,capt){

function needBlock(v,target,kind){

/* ---------- резервная копия (текстом, без файлов) ---------- */
var CODE_PFX='OCENKI-1:';
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function exportCode(){return CODE_PFX+b64e(JSON.stringify({app:'ocenki',v:3,at:todayStr(),data:st}));}
function parseCode(txt){
  txt=String(txt||'').trim();if(!txt)throw new Error('Вставь код резервной копии');
  var obj,i=txt.indexOf(CODE_PFX);
  if(i>=0){var b=txt.slice(i+CODE_PFX.length).replace(/[^A-Za-z0-9+\/=]/g,'');try{obj=JSON.parse(b64d(b));}catch(e){throw new Error('Код повреждён — скопируй его целиком');}}
  else{try{obj=JSON.parse(txt);}catch(e){throw new Error('Это не похоже на код резервной копии');}}
  var data=obj&&obj.data&&obj.data.subjects?obj.data:obj;
  if(!data||!Array.isArray(data.subjects))throw new Error('В коде нет предметов');
  return normalize(JSON.parse(JSON.stringify(data)));
}
function copyText(text,ta){
  function fallback(){try{ta.removeAttribute('readonly');ta.focus();ta.select();ta.setSelectionRange(0,text.length);var ok=document.execCommand('copy');ta.setAttribute('readonly','');ta.blur();return ok;}catch(e){return false;}}
  return new Promise(function(res){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){res(true);},function(){res(fallback());});}
    else res(fallback());
  });
}

    else{var k=afford(after,thr(ga),2);
      snack('relieved','<b>«'+ga+'» пока держится</b><br>'+(k?'Запас ещё есть. ':'Запаса нет — постарайся в следующий раз. ')+tail,'Отменить',undo,6500);}
  }else snack(v===5?'star':v===4?'thumbs':'memo',(v===5?'<b>'+pickR(PRAISE5)+'</b> ':v===4?'<b>'+pickR(PRAISE4)+'</b> ':'')+'Оценка «'+v+'» записана','Отменить',undo,2500);
}
function ripple(btn,e){var r=btn.getBoundingClientRect(),sz=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='ripple';
  sp.style.width=sp.style.height=sz+'px';sp.style.left=((e.clientX||r.left+r.width/2)-r.left-sz/2)+'px';sp.style.top=((e.clientY||r.top+r.height/2)-r.top-sz/2)+'px';
  btn.appendChild(sp);setTimeout(function(){sp.remove();},600);}

/* ---------- конфетти ---------- */
var cv=document.getElementById('fx'),cx=cv.getContext('2d'),parts=[],running=false;
function confetti(count){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';cx.setTransform(dpr,0,0,dpr,0,0);
  var cols=['#f3e3b0','#d6b15e','#9c7731','#ffffff','#22c55e','#86efac','#e6c97f'];
  for(var i=0;i<(count||140);i++)parts.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0});
  if(!running){running=true;requestAnimationFrame(tick);}
}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.life<160&&p.y<innerHeight+40;});
  if(document.hidden)parts=[];
  parts.forEach(function(p){p.life++;p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-p.life/160);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  if(parts.length)requestAnimationFrame(tick);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight);}}

/* ---------- клики ---------- */
app.addEventListener('click',function(e){
  var hit=e.target.closest('[data-ci]');if(hit){chartTap(hit.getAttribute('data-chart'),+hit.getAttribute('data-ci'));return;}
  var t=e.target.closest('button,[data-open]');if(!t)return;
  var r=route(),s=r.subj&&subjById(r.subj),a=t.getAttribute('data-act');
  if(t.hasAttribute('data-open')){buzz(8);go(t.getAttribute('data-open'));return;}
  if(t.hasAttribute('data-view')){ui.view=t.getAttribute('data-view');saveUi();render();buzz(8);return;}
  if(t.hasAttribute('data-shift')){var dd=+t.getAttribute('data-shift');
    if(!s&&ui.view==='q'){ui.qq+=dd;if(ui.qq<0){ui.qq=3;ui.qy--;}if(ui.qq>3){ui.qq=0;ui.qy++;}}
    else if(!s&&ui.view==='y'){ui.sy+=dd;}
    else{ui.m+=dd;if(ui.m<0){ui.m=11;ui.y--;}if(ui.m>11){ui.m=0;ui.y++;}ui.ghost=[];}
    render();buzz(6);return;}
  if(a==='add'){addSheet();return;}
  if(a==='settings'){settingsSheet();return;}
  if(a==='backup'){backupSheet();return;}
  if(a==='back'){if(location.hash&&history.length>1)history.back();else location.replace('#');return;}
  if(!s)return;
  if(a==='menu'){menuSheet(s);return;}
  if(a==='wi'){ui.wi=!ui.wi;ui.ghost=[];render();buzz(10);if(ui.wi)snack('crystal','<b>Режим «Что если?»</b><br>Нажимай цифры — посмотришь, что выйдет. В журнал ничего не пишется.',null,null,3500);return;}
  if(a==='wireset'){ui.ghost=[];render();buzz(8);return;}
  if(t.hasAttribute('data-key')){ripple(t,e);addMark(s,+t.getAttribute('data-key'));return;}
  if(t.hasAttribute('data-goal')){ui.goal[s.id]=+t.getAttribute('data-goal');render();buzz(8);return;}
  if(t.hasAttribute('data-qgoal')){var gv=+t.getAttribute('data-qgoal'),qk=t.getAttribute('data-qk');if(!s.goals)s.goals={};
    if(gv)s.goals[qk]=gv;else delete s.goals[qk];save();render();buzz(10);
    if(gv)snack('target','<b>Цель на четверть: «'+gv+'»</b><br>'+pickR(['Отличная цель!','Вперёд, у тебя получится!','Буду подсказывать, сколько осталось.']),null,null,2500);return;}
  if(t.hasAttribute('data-gh')){ui.ghost.splice(+t.getAttribute('data-gh'),1);render();return;}
  if(t.hasAttribute('data-mark')){
    var mk=s.marks.filter(function(m){return m.id===t.getAttribute('data-mark');})[0];if(!mk)return;
    t.classList.add('out');buzz(10);
    setTimeout(function(){var i=s.marks.indexOf(mk);if(i<0)return;s.marks.splice(i,1);save();render();
      snack('trash','Оценка «'+mk.v+'» убрана','Вернуть',function(){s.marks.splice(i,0,mk);ui.popId=mk.id;save();render();});},250);
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetBg)closeSheetNav();});

/* старт: шторку не восстанавливаем; под экраном предмета всегда есть главная в истории,
   чтобы системная «Назад» сначала возвращала на главную, а не закрывала приложение */
(function(){var r=route();
  var marked=history.state&&history.state.k;
  if(r.sheet||(r.subj&&!marked)){history.replaceState(null,'',location.pathname+location.search);
    if(r.subj&&subjById(r.subj))history.pushState({k:1},'','#s='+r.subj);}
  lastSubj=route().subj;
})();
render();
