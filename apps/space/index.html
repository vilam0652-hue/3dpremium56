<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Звёздный рейс</title>
<meta name="theme-color" content="#060a1c">
<link rel="stylesheet" href="../../shared/k.css">
<script src="../../shared/k.js"></script>
<script src="../../shared/three.min.js"></script>
<script src="../../shared/lib/CopyShader.js"></script>
<script src="../../shared/lib/LuminosityHighPassShader.js"></script>
<script src="../../shared/lib/EffectComposer.js"></script>
<script src="../../shared/lib/RenderPass.js"></script>
<script src="../../shared/lib/ShaderPass.js"></script>
<script src="../../shared/lib/UnrealBloomPass.js"></script>
<script src="../../shared/lib/GLTFLoader.js"></script>
<style>
  #gl { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .game-page .k-top, .game-page .hud { position: relative; z-index: 2; }
  .hearts { display: flex; gap: 4px; align-items: center; justify-content: center; height: 100%; }
  .hearts svg { width: 22px; height: 22px; transition: transform .3s var(--spring), opacity .3s; }
  .hearts svg.off { opacity: .2; transform: scale(.7); }
  .hint { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2; padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: .9rem; white-space: nowrap; transition: opacity .6s; }
  .flash { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle, transparent 40%, rgba(255,60,90,.55)); opacity: 0; transition: opacity .4s; }
  .flash.on { opacity: 1; transition: none; }
  .shieldbar { position: fixed; left: 50%; top: calc(140px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 2; width: 160px; }
</style>
</head>
<body class="game-page">
<canvas id="gl"></canvas>
<div class="flash" id="flash"></div>
<div class="hud">
  <div class="stat glass"><b id="score" class="num">0</b><small>очки</small></div>
  <div class="stat glass"><b id="stars" class="num">0</b><small>звёзды</small></div>
  <div class="stat glass"><div class="hearts" id="hearts"></div><small>жизни</small></div>
</div>
<div class="progress shieldbar" id="shield" hidden><i style="width:100%"></i></div>
<div class="hint glass" id="hint">Свайп или ← → чтобы менять полосу</div>
<script>
(() => {
  K.top({ title: "Звёздный рейс" });
  const LANES = [-2.6, 0, 2.6];
  const cv = document.getElementById("gl");
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x08080a);
  scene.fog = new THREE.FogExp2(0x08080a, 0.018);
  const cam = new THREE.PerspectiveCamera(62, 1, .1, 300);
  cam.position.set(0, 4.4, 10.5);
  // свечение, как в 3D Bust
  let composer = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass) {
    try {
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, cam));
      composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(512, 512), 0.3, 0.45, 0.82));
    } catch (e) { composer = null; }
  }


  // мягкие отражения для золота и чёрного стекла
  { const pm = new THREE.PMREMGenerator(renderer), env = new THREE.Scene();
    [[0xffffff, 6, 8, 4, 3], [0xf3d9a0, -7, 4, -3, 3], [0x6b5020, 0, -6, 6, 4], [0xffffff, 0, 6, -8, 2]].forEach(([c, x, y, z, r]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); env.add(m); });
    scene.environment = pm.fromScene(env, .04).texture; }
  scene.add(new THREE.HemisphereLight(0xfff2d6, 0x1a1408, .6));
  const sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(4, 12, 8); scene.add(sun);
  const pl1 = new THREE.PointLight(0xd6b15e, 1.4, 30); pl1.position.set(-6, 4, 2); scene.add(pl1);
  const pl2 = new THREE.PointLight(0xffffff, .8, 30); pl2.position.set(6, 4, 4); scene.add(pl2);

  // ---------- корабль ----------
  const ship = new THREE.Group(); scene.add(ship);
  const hullMat = new THREE.MeshPhysicalMaterial({ color: 0x141418, metalness: .85, roughness: .18, clearcoat: 1, clearcoatRoughness: .05 });
  const accentMat = new THREE.MeshPhysicalMaterial({ color: 0xd6b15e, metalness: 1, roughness: .22, clearcoat: 1 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.55, .55, 1.6, 20), hullMat); body.rotation.x = Math.PI / 2; ship.add(body);
  const tail = new THREE.Mesh(new THREE.SphereGeometry(.55, 20, 14), hullMat); tail.position.z = .8; ship.add(tail);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(.55, 1, 20), accentMat); nose.rotation.x = -Math.PI / 2; nose.position.z = -1.55; ship.add(nose);
  const glass = new THREE.Mesh(new THREE.SphereGeometry(.48, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshPhysicalMaterial({ color: 0xf3e3b0, metalness: .2, roughness: 0, emissive: 0x3a2c10, emissiveIntensity: .4, clearcoat: 1, transparent: true, opacity: .85 }));
  glass.position.set(0, .32, -.35); glass.scale.set(1, .9, 1.5); ship.add(glass);
  const wingGeo = new THREE.BoxGeometry(1.6, .1, .8);
  [-1, 1].forEach((s) => {
    const w = new THREE.Mesh(wingGeo, accentMat); w.position.set(s * .95, -.1, .3); w.rotation.z = s * -.25; ship.add(w);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.14, 12, 12), new THREE.MeshBasicMaterial({ color: 0xf3e3b0 })); tip.position.set(s * 1.7, -.32, .35); ship.add(tip);
  });
  const flame = new THREE.Mesh(new THREE.ConeGeometry(.26, 1.4, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xffd98a, transparent: true, opacity: .6, blending: THREE.AdditiveBlending, depthWrite: false }));
  flame.rotation.x = -Math.PI / 2; flame.position.z = 1.95; ship.add(flame);
  const engineLight = new THREE.PointLight(0xffd98a, 1.2, 5); engineLight.position.z = 2; ship.add(engineLight);
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(1.9, 32, 24), new THREE.MeshPhysicalMaterial({ color: 0xf3e3b0, transparent: true, opacity: .18, roughness: 0, metalness: 0, clearcoat: 1, emissive: 0x6b5020, emissiveIntensity: .4, side: THREE.DoubleSide, depthWrite: false }));
  bubble.visible = false; ship.add(bubble);
  ship.position.y = .9;
  const builtIn = ship.children.filter((c) => c !== flame && c !== bubble && c !== engineLight);
  // 3D-иллюстрации Microsoft Fluent как спрайты: ракета, камни, звёзды, щит
  const texLoader = new THREE.TextureLoader();
  const TEX = {}; ["rocket", "rock", "comet", "star", "shield", "star-glow"].forEach((n) => { TEX[n] = texLoader.load(K.artSrc(n)); TEX[n].anisotropy = 4; });
  const sprite = (n, size, rot = 0) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX[n], transparent: true, rotation: rot, depthWrite: false })); m.scale.set(size, size, 1); return m; };
  const shipSprite = sprite("rocket", 2.7, Math.PI / 4); shipSprite.position.y = .3;
  builtIn.forEach((c) => (c.visible = false)); flame.visible = false; ship.add(shipSprite);

  // ---------- настоящие 3D-модели (models/*.glb из Meshy/Tripo); нет файла — остаются встроенные фигуры ----------
  const MODELS = { rocks: [], star: null };
  function loadGLB(name, size) {
    return new Promise((res) => {
      if (!THREE.GLTFLoader) return res(null);
      new THREE.GLTFLoader().load("models/" + name, (g) => {
        const o = g.scene, box = new THREE.Box3().setFromObject(o), v = box.getSize(new THREE.Vector3());
        const k = size / Math.max(v.x, v.y, v.z, 1e-6); o.scale.setScalar(k);
        o.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(k));
        o.traverse((n) => { if (n.isMesh && n.material) { n.material.envMapIntensity = 1.2; } });
        const w = new THREE.Group(); w.add(o); res(w);
      }, undefined, () => res(null));
    });
  }
  loadGLB("ship.glb", 3.4).then((m) => { if (!m) return; m.rotation.y = Math.PI; shipSprite.visible = false; flame.visible = true; ship.add(m); });
  ["asteroid-1.glb", "asteroid-2.glb"].forEach((f) => loadGLB(f, 2).then((m) => m && MODELS.rocks.push(m)));
  loadGLB("star.glb", 1.1).then((m) => { if (m) MODELS.star = m; });

  // ---------- дорога из света ----------
  const grid = new THREE.GridHelper(200, 80, 0x8c6a2a, 0x2a2418); grid.position.y = -.4; grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);
  LANES.forEach((x) => {
    const l = new THREE.Mesh(new THREE.PlaneGeometry(.06, 200), new THREE.MeshBasicMaterial({ color: 0xd6b15e, transparent: true, opacity: .55, blending: THREE.AdditiveBlending }));
    l.rotation.x = -Math.PI / 2; l.position.set(x, -.38, -60); scene.add(l);
  });
  // звёздная пыль
  const N = 1400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - .5) * 120; pos[i * 3 + 1] = Math.random() * 50 - 5; pos[i * 3 + 2] = -Math.random() * 200; }
  const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xe9e4da, size: .07, transparent: true, opacity: .7 })); scene.add(dust);
  // далёкая планета
  const far = new THREE.Mesh(new THREE.SphereGeometry(18, 48, 32), new THREE.MeshStandardMaterial({ color: 0xd9d4c8, roughness: .5, metalness: .1 }));
  far.position.set(-38, 18, -150); scene.add(far);
  const ring = new THREE.Mesh(new THREE.RingGeometry(24, 34, 64), new THREE.MeshBasicMaterial({ color: 0xd6b15e, transparent: true, opacity: .35, side: THREE.DoubleSide, fog: false }));
  ring.position.copy(far.position); ring.rotation.set(1.2, .3, 0); scene.add(ring);

  // ---------- объекты ----------
  const rockMats = [0x1d1c22, 0x2a2724, 0x15151a].map((c) => new THREE.MeshStandardMaterial({ color: c, emissive: 0x3a2a0c, emissiveIntensity: .25, roughness: .55, metalness: .45, flatShading: true }));
  const rockGeo = new THREE.IcosahedronGeometry(1, 1);
  { const p = rockGeo.attributes.position; for (let i = 0; i < p.count; i++) { const k = .8 + Math.random() * .35; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k); } rockGeo.computeVertexNormals(); }
  const starGeo = new THREE.OctahedronGeometry(.55, 0);
  const starMat = new THREE.MeshPhysicalMaterial({ color: 0xe6c97f, emissive: 0x6b5020, emissiveIntensity: .5, metalness: 1, roughness: .18, clearcoat: 1 });
  const shieldMat = new THREE.MeshPhysicalMaterial({ color: 0xf6f4ef, emissive: 0x6b5020, emissiveIntensity: .4, metalness: .3, roughness: 0, clearcoat: 1 });
  let objs = [], bits = [];

  function spawnRow(z) {
    const free = [0, 1, 2];
    const rocks = Math.random() < .3 + Math.min(.4, speed / 200) ? 2 : 1;
    for (let i = 0; i < rocks; i++) {
      const li = free.splice((Math.random() * free.length) | 0, 1)[0];
      const s = .9 + Math.random() * .5;
      let m;
      if (MODELS.rocks.length) { m = MODELS.rocks[(Math.random() * MODELS.rocks.length) | 0].clone(); m.scale.setScalar(s); }
      else { m = sprite(Math.random() < .25 ? "comet" : "rock", 2.3 * s, Math.random() * 6); }
      m.position.set(LANES[li], .9, z); m.userData = { t: "rock", r: s, spin: new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(2) };
      scene.add(m); objs.push(m);
    }
    free.forEach((li) => {
      if (Math.random() < .55) {
        for (let k = 0; k < 3; k++) {
          const s = MODELS.star ? MODELS.star.clone() : sprite("star", 1.25); s.position.set(LANES[li], 1, z - k * 3.2); s.userData = { t: "star" };
          scene.add(s); objs.push(s);
        }
      } else if (Math.random() < .08) {
        const s = sprite("shield", 1.5); s.position.set(LANES[li], 1, z); s.userData = { t: "shield" };
        scene.add(s); objs.push(s);
      }
    });
  }
  function boom(p, color, n = 26) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.TetrahedronGeometry(.12 + Math.random() * .2), new THREE.MeshBasicMaterial({ color }));
      m.position.copy(p); m.userData = { v: new THREE.Vector3((Math.random() - .5) * 14, Math.random() * 10, (Math.random() - .5) * 14), life: 1 };
      scene.add(m); bits.push(m);
    }
  }

  // ---------- состояние ----------
  let lane = 1, speed, dist, stars, lives, playing = false, nextZ, inv = 0, shieldT = 0, last = 0, time = 0;
  const $score = document.getElementById("score"), $stars = document.getElementById("stars"), $hearts = document.getElementById("hearts"), $shield = document.getElementById("shield");
  const HEART = `<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.4-9.3C1.2 8.2 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.6 0 5.8 3.7 4.4 7.2C19.5 16.4 12 21 12 21z" fill="#d6b15e" stroke="#f3e3b0"/></svg>`;
  const drawHearts = () => { $hearts.innerHTML = [0, 1, 2].map((i) => HEART.replace("<svg", `<svg class="${i < lives ? "" : "off"}"`)).join(""); };

  function move(d) { if (!playing) return; const n = Math.max(0, Math.min(2, lane + d)); if (n !== lane) { lane = n; K.sfx("tap"); hideHint(); } }
  addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "a") move(-1); if (e.key === "ArrowRight" || e.key === "d") move(1); });
  let sx = null, sy = 0, swiped = false;
  cv.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; swiped = false; });
  cv.addEventListener("pointermove", (e) => { if (sx == null || swiped) return; const dx = e.clientX - sx; if (Math.abs(dx) > 30) { move(dx > 0 ? 1 : -1); swiped = true; } });
  cv.addEventListener("pointerup", (e) => { if (sx != null && !swiped) move(e.clientX < innerWidth / 2 ? -1 : 1); sx = null; });
  let hinted = false; function hideHint() { if (hinted) return; hinted = true; document.getElementById("hint").style.opacity = 0; }

  function resize() { renderer.setSize(innerWidth, innerHeight, false); composer && composer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.fov = cam.aspect < .8 ? 72 : 60; cam.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize();

  function hit(o) {
    if (shieldT > 0) { boom(o.position, 0xf3e3b0, 18); K.sfx("pop"); remove(o); return; }
    if (inv > 0) return;
    lives--; drawHearts(); inv = 1.6;
    boom(o.position, 0xd6b15e); remove(o); K.sfx("boom"); K.vibrate(80);
    const f = document.getElementById("flash"); f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 60);
    if (lives <= 0) over();
  }
  function remove(o) { scene.remove(o); objs = objs.filter((x) => x !== o); }

  function tick(t) {
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t; time += dt;
    if (playing) {
      speed = Math.min(62, speed + dt * .55);
      dist += speed * dt;
      $score.textContent = Math.floor(dist) + stars * 25;
      inv = Math.max(0, inv - dt);
      if (shieldT > 0) { shieldT -= dt; $shield.firstElementChild.style.width = Math.max(0, shieldT / 8 * 100) + "%"; if (shieldT <= 0) { bubble.visible = false; $shield.hidden = true; } }
      nextZ += speed * dt;
      while (nextZ > -95) { spawnRow(nextZ - 100); nextZ -= Math.max(9, 18 - speed * .12); }
    }
    const v = playing ? speed : 8;
    // корабль: мягкий переход по полосам + наклон
    const tx = LANES[lane], dx = tx - ship.position.x;
    ship.position.x += dx * Math.min(1, dt * 10);
    ship.rotation.z = -dx * .35; ship.rotation.y = -dx * .12; shipSprite.material.rotation = Math.PI / 4 - dx * .25;
    ship.position.y = .9 + Math.sin(time * 3) * .08;
    ship.visible = !(inv > 0 && Math.floor(time * 14) % 2);
    flame.scale.set(1, .8 + Math.random() * .5 + v / 80, 1);
    bubble.rotation.y += dt;
    cam.position.x += (ship.position.x * .5 - cam.position.x) * Math.min(1, dt * 3);
    cam.lookAt(ship.position.x * .3, 1, -6);
    grid.position.z = (grid.position.z + v * dt) % (200 / 80);
    const p = dustGeo.attributes.position;
    for (let i = 0; i < N; i++) { let z = p.getZ(i) + v * dt * 1.5; if (z > 10) z -= 210; p.setZ(i, z); }
    p.needsUpdate = true;
    far.rotation.y += dt * .05;
    for (const o of objs.slice()) {
      o.position.z += v * dt;
      if (o.userData.t === "rock") { if (o.isSprite) o.material.rotation += o.userData.spin.z * .6 * dt; else { o.rotation.x += o.userData.spin.x * dt; o.rotation.y += o.userData.spin.y * dt; } }
      else { o.rotation.y += dt * 3; o.position.y = 1 + Math.sin(time * 4 + o.position.z) * .15; }
      if (o.position.z > 12) { remove(o); continue; }
      if (playing && Math.abs(o.position.z - ship.position.z) < (o.userData.t === "rock" ? 1.1 * o.userData.r : 1.2) && Math.abs(o.position.x - ship.position.x) < 1.4) {
        if (o.userData.t === "rock") hit(o);
        else if (o.userData.t === "star") { stars++; $stars.textContent = stars; K.sfx("coin"); boom(o.position, 0xf3e3b0, 8); remove(o); }
        else { shieldT = 8; bubble.visible = true; $shield.hidden = false; K.sfx("good"); remove(o); K.toast("Щит включён на 8 секунд!"); }
      }
    }
    for (const b of bits.slice()) {
      b.userData.v.y -= 20 * dt; b.position.addScaledVector(b.userData.v, dt); b.position.z += v * dt * .5; b.rotation.x += dt * 8;
      b.userData.life -= dt * 1.2; b.scale.setScalar(Math.max(.01, b.userData.life));
      if (b.userData.life <= 0) { scene.remove(b); bits = bits.filter((x) => x !== b); }
    }
    composer ? composer.render() : renderer.render(scene, cam);
    requestAnimationFrame(tick);
  }

  function over() {
    playing = false; boom(ship.position, 0xd6b15e, 40); ship.visible = false;
    const score = Math.floor(dist) + stars * 25;
    const rec = K.best("space", score);
    K.sfx(rec ? "win" : "lose"); if (rec) K.confetti();
    const drops = Math.floor(score / 60) + stars;
    setTimeout(() => {
      K.panel({
        title: rec ? "Новый рекорд!" : "Полёт окончен",
        score, scoreLabel: `очков · рекорд ${K.getBest("space")}`, stars: score > 3000 ? 3 : score > 1500 ? 2 : score > 500 ? 1 : 0,
        text: `Собрано звёзд: ${stars}. +${drops} ${K.plural(drops, "капелька", "капельки", "капелек")}`,
        buttons: [{ label: "Ещё полёт", cls: "big", onClick: start }]
      });
      setTimeout(() => K.coins.add(drops, document.querySelector(".overlay .big-score")), 400);
    }, 700);
  }
  function start() {
    objs.forEach((o) => scene.remove(o)); objs = [];
    lane = 1; speed = 22; dist = 0; stars = 0; lives = 3; inv = 0; shieldT = 0; nextZ = -30;
    bubble.visible = false; $shield.hidden = true; ship.visible = true; ship.position.x = 0;
    $stars.textContent = 0; drawHearts(); playing = true;
  }
  lives = 3; drawHearts(); speed = 0; dist = 0; stars = 0;
  requestAnimationFrame(tick);
  K.panel({
    title: "Звёздный рейс",
    text: "Лети между астероидами и собирай звёзды. Голубой шар включает щит. Свайпай влево и вправо или нажимай на край экрана.",
    buttons: [{ label: "Полетели!", cls: "big", onClick: start }]
  });
})();
</script>
</body>
</html>
