<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Звёздный рейс</title>
<meta name="theme-color" content="#050507">
<link rel="stylesheet" href="../../shared/k.css">
<script src="../../shared/k.js"></script>
<script src="../../shared/three.min.js"></script>
<script src="../../shared/lib/CopyShader.js"></script>
<script src="../../shared/lib/LuminosityHighPassShader.js"></script>
<script src="../../shared/lib/EffectComposer.js"></script>
<script src="../../shared/lib/RenderPass.js"></script>
<script src="../../shared/lib/ShaderPass.js"></script>
<script src="../../shared/lib/UnrealBloomPass.js"></script>
<script src="../../shared/lib/GLTFLoader.js"></script>
<style>
  body.game-page { background: #050507; }
  #gl { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .game-page .k-top, .game-page .hud, .mrow, .buffs { position: relative; z-index: 2; }
  .game-page .k-bg { display: none; }
  .hud .stat { min-width: 92px; }
  .hud .stat b.bump { animation: k-bump .35s var(--spring); }
  .hearts { display: flex; gap: 3px; align-items: center; justify-content: center; height: 1.32rem; }
  .hearts svg { width: 20px; height: 20px; transition: transform .35s var(--spring), opacity .35s; }
  .hearts svg.off { opacity: .18; transform: scale(.6); }
  .hearts.hurt { animation: k-shake .4s; }

  /* миссии забега */
  .mrow { display: flex; gap: 6px; justify-content: center; padding: 8px 12px 0; pointer-events: none; }
  .mchip { display: flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 999px; font-size: .74rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; transition: transform .4s var(--spring); }
  .mchip img { width: 22px; height: 22px; }
  .mchip.done { box-shadow: inset 0 0 0 1px var(--gold), 0 0 18px -4px rgba(214,177,94,.7); color: var(--gold-hi); }
  .mchip.done.flash { animation: k-bump .5s var(--spring); }

  /* активные бонусы */
  .buffs { display: flex; gap: 6px; justify-content: center; padding: 8px 12px 0; pointer-events: none; min-height: 44px; }
  .buff { flex: none; width: auto; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; animation: k-pop .4s var(--spring); }
  .buff img { width: 28px; height: 28px; }
  .buff .progress { flex: none; width: 56px; height: 6px; }
  .buff .progress > i { transition: none; }

  .pop { position: fixed; left: 50%; top: 38%; z-index: 3; pointer-events: none; white-space: nowrap;
    font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; letter-spacing: -.01em;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.8)); animation: sp-pop 1.1s var(--ease) both; }
  .pop.small { font-size: 1.05rem; top: 44%; }
  @keyframes sp-pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 14% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); } 28% { transform: translate(-50%,-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-90%) scale(.98); } }

  .flash { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle, transparent 38%, rgba(255,70,80,.5)); opacity: 0; transition: opacity .45s; }
  .flash.on { opacity: 1; transition: none; }

  /* подсказка в начале: зоны касания по краям */
  .edges { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: opacity .6s; }
  .edges.off { opacity: 0; }
  .edge { position: absolute; top: 46%; bottom: 0; width: 38%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--gold-hi); font-weight: 800; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
  .edge.l { left: 0; background: linear-gradient(90deg, rgba(214,177,94,.2), transparent); border-radius: 0 40px 0 0; }
  .edge.r { right: 0; background: linear-gradient(270deg, rgba(214,177,94,.2), transparent); border-radius: 40px 0 0 0; }
  .edge svg { width: 44px; height: 44px; filter: drop-shadow(0 0 10px rgba(214,177,94,.8)); }
  .edge.l svg { animation: sp-nudge-l 1.1s var(--ease) infinite; }
  .edge.r svg { animation: sp-nudge-r 1.1s var(--ease) infinite; }
  @keyframes sp-nudge-l { 50% { transform: translateX(-8px); } }
  @keyframes sp-nudge-r { 50% { transform: translateX(8px); } }
  .edges .hint { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: .88rem; white-space: nowrap; }

  /* окна */
  .legend { display: flex; gap: 8px; justify-content: center; width: 100%; }
  .legend > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); }
  .legend img { width: 40px; height: 40px; }
  .legend b { font-size: .82rem; }
  .legend small { font-size: .68rem; color: var(--muted); line-height: 1.2; }
  .mlist { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .mlist li { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 8px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); font-size: .88rem; }
  .mlist li img { width: 26px; height: 26px; flex: none; }
  .mlist li span { flex: 1; }
  .mlist li em { font-style: normal; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .mlist li.done { border-color: var(--stroke-c); }
  .mlist li.done em { color: var(--gold-hi); }
  .mtitle { font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 800; margin-bottom: -6px; }
  .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .res > div { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); }
  .res img, .res svg { width: 30px; height: 30px; }
  .res b { font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .res small { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .overlay .panel { max-height: calc(100dvh - 40px); overflow-y: auto; }
  .overlay .panel .stars svg { width: 38px; height: 38px; }
</style>
</head>
<body class="game-page">
<canvas id="gl"></canvas>
<div class="flash" id="flash"></div>
<div class="hud">
  <div class="stat glass"><b id="dist" class="num">0</b><small>метры</small></div>
  <div class="stat glass"><b id="stars" class="num">0</b><small>звёзды</small></div>
  <div class="stat glass"><div class="hearts" id="hearts"></div><small>жизни</small></div>
</div>
<div class="mrow" id="mrow"></div>
<div class="buffs" id="buffs"></div>
<div class="edges off" id="edges" hidden>
  <div class="edge l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>тап</div>
  <div class="edge r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>тап</div>
  <div class="hint glass">Тапни по краю или проведи пальцем</div>
</div>
<script src="game.js"></script>
</body>
</html>
