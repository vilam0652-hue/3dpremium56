<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Стеклобой</title>
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="../../shared/k.css">
<script src="../../shared/k.js"></script>
<style>
  .hud { align-items: stretch; }
  .hud .stat { min-width: 74px; padding: 6px 12px; }
  .hud.off { visibility: hidden; }
  .hud .pause { min-width: 0; width: 50px; padding: 0; display: grid; place-items: center; border: 1px solid var(--stroke); color: var(--text); font: inherit; }
  .hud .pause svg { width: 20px; height: 20px; }
  .hud .pause:active { transform: scale(.92); }
  .hearts { display: flex; gap: 2px; justify-content: center; height: 27px; align-items: center; }
  .hearts svg { width: 19px; height: 19px; transition: transform .3s var(--spring), opacity .3s; }
  .hearts svg.off { opacity: .2; transform: scale(.7); }
  .hearts svg.pop { animation: hpop .5s var(--spring); }
  @keyframes hpop { from { transform: scale(1.8); } }

  .stage { padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px)); }
  .field { border-radius: 24px; overflow: hidden; position: relative; }
  #c { display: block; touch-action: none; }

  /* карта уровней */
  .mapview { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(14px, env(safe-area-inset-left, 0px)) 110px; touch-action: pan-y; }
  .mapview .head { display: flex; align-items: center; gap: 14px; width: min(460px, 100%); margin: 6px auto 14px; }
  .mapview .head img { width: 64px; height: 64px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
  .mapview .head h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; margin: 0; line-height: 1.1; }
  .mapview .head .row { margin-top: 6px; gap: 6px; }
  .mapview .chip { padding: 5px 11px; font-size: .8rem; color: var(--gold-hi); }
  .mapview .chip svg { width: 15px; height: 15px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(460px, 100%); margin: 0 auto; }
  .tile { position: relative; border-radius: 20px; padding: 8px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--stroke); text-align: center; transition: transform .3s var(--spring); }
  .tile:active { transform: scale(.94); }
  .tile canvas { width: 100%; aspect-ratio: 11 / 8; border-radius: 10px; background: rgba(0,0,0,.35); }
  .tile .n { position: absolute; top: 4px; left: 8px; font-family: var(--f-display); font-size: .7rem; color: var(--muted); }
  .tile .nm { font-size: .74rem; font-weight: 800; line-height: 1.15; min-height: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tile .st { display: flex; gap: 1px; }
  .tile .st svg { width: 15px; height: 15px; }
  .tile.locked { opacity: .55; }
  .tile.locked canvas { filter: grayscale(1) brightness(.5); }
  .tile.locked .lock { position: absolute; top: 18%; left: 50%; width: 38px; height: 38px; transform: translateX(-50%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  .tile.next { border-color: rgba(214,177,94,.7); box-shadow: 0 0 0 0 rgba(214,177,94,.55); animation: knext 2s ease-out infinite; }
  @keyframes knext { 0% { box-shadow: 0 0 0 0 rgba(214,177,94,.5); } 70%, 100% { box-shadow: 0 0 0 12px rgba(214,177,94,0); } }
  .playbar { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
  .playbar .btn { pointer-events: auto; min-width: 230px; }

  /* итоги */
  .res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .res-stats div { border-radius: 16px; padding: 8px 4px; background: rgba(255,255,255,.05); border: 1px solid var(--stroke); }
  .res-stats b { display: block; font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; color: var(--text); }
  .res-stats small { font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .res-hint { font-size: .85rem; }
  .overlay .panel .row { gap: 8px; }
  .overlay .panel .btn { padding: 0 20px; }
</style>
</head>
<body class="game-page">
<div class="hud" id="hud" hidden>
  <button class="stat glass pause" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  <div class="stat glass"><b id="score" class="num">0</b><small>очки</small></div>
  <div class="stat glass"><b id="lvl" class="num">1</b><small>уровень</small></div>
  <div class="stat glass"><div class="hearts" id="hearts"></div><small>жизни</small></div>
</div>
<main class="stage" id="stage">
  <div class="field glass" id="field"><canvas id="c" aria-label="Игровое поле"></canvas></div>
  <section class="mapview" id="map" hidden></section>
</main>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
