<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Стеклобой</title>
<meta name="theme-color" content="#060a1c">
<link rel="stylesheet" href="../../shared/k.css">
<script src="../../shared/k.js"></script>
<style>
  .field { border-radius: 26px; overflow: hidden; }
  #c { display: block; touch-action: none; }
  .hearts { display: flex; gap: 4px; justify-content: center; height: 26px; align-items: center; }
  .hearts svg { width: 22px; height: 22px; transition: transform .3s var(--spring), opacity .3s; }
  .hearts svg.off { opacity: .2; transform: scale(.7); }
</style>
</head>
<body class="game-page">
<div class="hud">
  <div class="stat glass"><b id="score" class="num">0</b><small>очки</small></div>
  <div class="stat glass"><b id="lvl" class="num">1</b><small>уровень</small></div>
  <div class="stat glass"><div class="hearts" id="hearts"></div><small>жизни</small></div>
</div>
<main class="stage"><div class="field glass"><canvas id="c"></canvas></div></main>
<script>
(() => {
  K.top({ title: "Стеклобой" });
  const cv = document.getElementById("c"), g = cv.getContext("2d");
  const $score = document.getElementById("score"), $lvl = document.getElementById("lvl"), $hearts = document.getElementById("hearts");
  const COLS = ["#ff5fa2", "#ff9a4d", "#ffd84d", "#6dffa8", "#5ee7ff", "#a68bff"];
  const LEVELS = [
    ["......", "AAAAAA", "BBBBBB", "CCCCCC", "DDDDDD"],
    ["A....A", "BB..BB", "CCCCCC", "D#DD#D", "EEEEEE", "F....F"],
    ["..AA..", ".BBBB.", "CC##CC", "DDDDDD", ".E..E.", "F.FF.F"],
    ["#A#A#A", "BBBBBB", "C#CC#C", "DDDDDD", "E#EE#E", "FFFFFF"],
    ["AAAAAA", "B#BB#B", "CCCCCC", "##DD##", "EEEEEE", "F#FF#F", "AAAAAA"]
  ];
  let W, H, dpr, paddle, balls, bricks, shards, drops, score, lives, level, playing = false, stuck, last = 0, t = 0, shake = 0;

  function layout() {
    const st = document.querySelector(".stage").getBoundingClientRect();
    W = Math.floor(Math.min(innerWidth - 32, 460)); H = Math.floor(Math.min(st.height - 24, W * 1.45));
    dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px"; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function buildLevel() {
    bricks = [];
    const map = LEVELS[(level - 1) % LEVELS.length], cols = 6, gap = 6, bw = (W - 24 - gap * (cols - 1)) / cols, bh = Math.max(18, bw * .38);
    map.forEach((row, r) => [...row].forEach((ch, c) => {
      if (ch === ".") return;
      const hard = ch === "#";
      bricks.push({ x: 12 + c * (bw + gap), y: 54 + r * (bh + gap), w: bw, h: bh, c: hard ? "#dfe6ff" : COLS["ABCDEF".indexOf(ch)], hp: hard ? 2 + (level > 3 ? 1 : 0) : 1, hard, hit: 0 });
    }));
  }
  function newBall() { return { x: paddle.x, y: paddle.y - 12, vx: 0, vy: 0, r: 8, trail: [] }; }
  function reset() { paddle = { x: W / 2, y: H - 36, w: Math.max(80, W * .24), tw: Math.max(80, W * .24), wideT: 0 }; balls = [newBall()]; stuck = true; }

  function launch() { if (!stuck) return; stuck = false; const sp = speed(); balls.forEach((b) => { const a = -Math.PI / 2 + (Math.random() - .5) * .6; b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; }); K.sfx("tap"); }
  const speed = () => Math.min(560, (W * .85) + level * 25);

  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); aim(e); });
  cv.addEventListener("pointermove", aim);
  cv.addEventListener("pointerup", () => { if (playing) launch(); });
  function aim(e) { const r = cv.getBoundingClientRect(); paddle && (paddle.tx = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, e.clientX - r.left))); }
  addEventListener("keydown", (e) => { if (!paddle) return; if (e.key === "ArrowLeft") paddle.tx = Math.max(paddle.w / 2, (paddle.tx ?? paddle.x) - 40); if (e.key === "ArrowRight") paddle.tx = Math.min(W - paddle.w / 2, (paddle.tx ?? paddle.x) + 40); if (e.key === " " && playing) launch(); });

  function shatter(b) {
    const n = b.hard ? 10 : 14;
    for (let i = 0; i < n; i++) {
      const x = b.x + Math.random() * b.w, y = b.y + Math.random() * b.h;
      const pts = [0, 1, 2].map(() => [(Math.random() - .5) * b.h, (Math.random() - .5) * b.h]);
      shards.push({ x, y, vx: (x - (b.x + b.w / 2)) * 3 + (Math.random() - .5) * 120, vy: -Math.random() * 180 - 40, rot: 0, vr: (Math.random() - .5) * 12, pts, c: b.c, life: 1.6 });
    }
  }
  function collideBrick(ball, b) {
    const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    const dx = ball.x - cx, dy = ball.y - cy;
    if (dx * dx + dy * dy > ball.r * ball.r) return false;
    if (Math.abs(dx) > Math.abs(dy)) { ball.vx = Math.abs(ball.vx) * Math.sign(dx || 1); } else { ball.vy = Math.abs(ball.vy) * Math.sign(dy || 1); }
    return true;
  }
  function step(dt) {
    paddle.x += ((paddle.tx ?? paddle.x) - paddle.x) * Math.min(1, dt * 18);
    if (paddle.wideT > 0) { paddle.wideT -= dt; if (paddle.wideT <= 0) paddle.tw = Math.max(80, W * .24); }
    paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 8);
    for (const ball of balls) {
      if (stuck) { ball.x = paddle.x; ball.y = paddle.y - 14; continue; }
      const sub = 4;
      for (let s = 0; s < sub; s++) {
        ball.x += ball.vx * dt / sub; ball.y += ball.vy * dt / sub;
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); K.sfx("tap"); }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); K.sfx("tap"); }
        if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); K.sfx("tap"); }
        // ракетка: угол отскока зависит от места удара
        if (ball.vy > 0 && ball.y + ball.r > paddle.y - 7 && ball.y < paddle.y + 7 && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) {
          const k = (ball.x - paddle.x) / (paddle.w / 2), a = -Math.PI / 2 + k * 1.05, sp = Math.hypot(ball.vx, ball.vy);
          ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp; ball.y = paddle.y - 7 - ball.r; K.sfx("place"); K.vibrate(8);
        }
        for (const b of bricks) {
          if (b.dead || !collideBrick(ball, b)) continue;
          b.hp--; b.hit = 1;
          if (b.hp <= 0) {
            b.dead = true; shatter(b); score += b.hard ? 30 : 10; $score.textContent = score; K.sfx("pop", 1 + Math.random() * .4); shake = 4;
            if (Math.random() < .14) drops.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, kind: Math.random() < .5 ? "multi" : "wide" });
          } else K.sfx("place");
          break;
        }
      }
      ball.trail.push([ball.x, ball.y]); if (ball.trail.length > 10) ball.trail.shift();
    }
    const before = balls.length;
    balls = balls.filter((b) => b.y < H + 20);
    if (before && !balls.length) loseLife();
    for (const d of drops) {
      d.y += 140 * dt;
      if (d.y > paddle.y - 10 && d.y < paddle.y + 10 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 10) {
        d.got = true; K.sfx("good");
        if (d.kind === "wide") { paddle.tw = Math.max(80, W * .24) * 1.6; paddle.wideT = 10; K.toast("Широкая ракетка!"); }
        else { const src = balls[0]; if (src) for (let i = 0; i < 2; i++) { const a = -Math.PI / 2 + (i ? .5 : -.5), sp = Math.hypot(src.vx, src.vy) || speed(); balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 8, trail: [] }); } K.toast("Три мяча!"); }
      }
    }
    drops = drops.filter((d) => !d.got && d.y < H + 20);
    for (const s of shards) { s.vy += 600 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; s.life -= dt; }
    shards = shards.filter((s) => s.life > 0 && s.y < H + 40);
    bricks.forEach((b) => (b.hit = Math.max(0, b.hit - dt * 5)));
    if (playing && bricks.every((b) => b.dead || false)) levelUp();
  }
  function loseLife() {
    lives--; drawHearts(); K.sfx("bad"); K.vibrate(60); shake = 10;
    if (lives <= 0) return over();
    reset();
  }
  function levelUp() {
    playing = false; K.sfx("win"); K.confetti();
    const gain = 50 * level; score += gain; $score.textContent = score;
    K.panel({ title: `Уровень ${level} пройден!`, stars: lives, text: `Бонус +${gain}. Дальше стекло крепче!`, buttons: [{ label: "Дальше", cls: "big", onClick: () => { level++; $lvl.textContent = level; buildLevel(); reset(); playing = true; } }] });
    K.coins.add(5 + level * 2, $score);
  }
  function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
  function draw() {
    g.save();
    if (shake > 0) { g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .85; if (shake < .3) shake = 0; }
    g.clearRect(-20, -20, W + 40, H + 40);
    for (const b of bricks) {
      if (b.dead) continue;
      const gr = g.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      gr.addColorStop(0, "rgba(255,255,255,.85)"); gr.addColorStop(.18, b.c); gr.addColorStop(1, b.c + "99");
      g.globalAlpha = b.hard ? .55 + .2 * b.hp : .9; g.fillStyle = gr; rrect(b.x, b.y, b.w, b.h, 8); g.fill();
      g.globalAlpha = 1; g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1; g.stroke();
      if (b.hard && b.hp < 3) { g.strokeStyle = "rgba(20,30,70,.6)"; g.beginPath(); g.moveTo(b.x + b.w * .3, b.y); g.lineTo(b.x + b.w * .45, b.y + b.h * .6); g.lineTo(b.x + b.w * .7, b.y + b.h); g.stroke(); }
      if (b.hit) { g.fillStyle = `rgba(255,255,255,${b.hit * .6})`; rrect(b.x, b.y, b.w, b.h, 8); g.fill(); }
    }
    for (const s of shards) {
      g.save(); g.translate(s.x, s.y); g.rotate(s.rot); g.globalAlpha = Math.min(1, s.life);
      g.fillStyle = s.c; g.strokeStyle = "rgba(255,255,255,.8)"; g.beginPath(); g.moveTo(...s.pts[0]); g.lineTo(...s.pts[1]); g.lineTo(...s.pts[2]); g.closePath(); g.fill(); g.stroke(); g.restore();
    }
    for (const d of drops) {
      g.save(); g.translate(d.x, d.y); g.rotate(t * 3);
      g.fillStyle = d.kind === "wide" ? "#6dffa8" : "#ffd84d"; g.shadowColor = g.fillStyle; g.shadowBlur = 14;
      rrect(-12, -12, 24, 24, 7); g.fill(); g.shadowBlur = 0; g.rotate(-t * 3);
      g.fillStyle = "#0b1030"; g.font = "900 13px Unbounded, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(d.kind === "wide" ? "↔" : "×3", 0, 1); g.restore();
    }
    // ракетка-капля
    const pg = g.createLinearGradient(0, paddle.y - 8, 0, paddle.y + 8);
    pg.addColorStop(0, "#ffffff"); pg.addColorStop(.3, "#5ee7ff"); pg.addColorStop(1, "#1f6bff");
    g.fillStyle = pg; g.shadowColor = "#5ee7ff"; g.shadowBlur = 18; rrect(paddle.x - paddle.w / 2, paddle.y - 7, paddle.w, 14, 7); g.fill(); g.shadowBlur = 0;
    for (const b of balls) {
      b.trail.forEach(([x, y], i) => { g.globalAlpha = i / b.trail.length * .4; g.fillStyle = "#9ff3ff"; g.beginPath(); g.arc(x, y, b.r * i / b.trail.length, 0, 7); g.fill(); });
      g.globalAlpha = 1;
      const bg = g.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r);
      bg.addColorStop(0, "#fff"); bg.addColorStop(1, "#ffd84d"); g.fillStyle = bg; g.shadowColor = "#ffd84d"; g.shadowBlur = 16;
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.shadowBlur = 0;
    }
    if (stuck && playing) { g.fillStyle = "rgba(255,255,255,.75)"; g.font = "800 15px Nunito, sans-serif"; g.textAlign = "center"; g.fillText("Нажми, чтобы запустить мяч", W / 2, H * .62); }
    g.restore();
  }
  function frame(ts) {
    const dt = Math.min(.033, (ts - (last || ts)) / 1000); last = ts; t += dt;
    if (playing) step(dt); else if (shards) { for (const s of shards) { s.vy += 600 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; s.life -= dt; } }
    if (paddle) draw();
    requestAnimationFrame(frame);
  }
  const HEART = `<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.4-9.3C1.2 8.2 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.6 0 5.8 3.7 4.4 7.2C19.5 16.4 12 21 12 21z" fill="#ff5fa2" stroke="#ffd0e3"/></svg>`;
  function drawHearts() { $hearts.innerHTML = [0, 1, 2].map((i) => HEART.replace("<svg", `<svg class="${i < lives ? "" : "off"}"`)).join(""); }
  function over() {
    playing = false;
    const rec = K.best("breakout", score); K.sfx(rec ? "win" : "lose"); if (rec && score) K.confetti();
    const drops_ = Math.floor(score / 40);
    K.panel({ title: rec && score ? "Новый рекорд!" : "Мячи закончились", score, scoreLabel: `очков · уровень ${level}`, stars: level > 3 ? 3 : level > 2 ? 2 : level > 1 ? 1 : 0,
      text: `+${drops_} ${K.plural(drops_, "капелька", "капельки", "капелек")}`, buttons: [{ label: "Ещё раз", cls: "big", onClick: start }] });
    setTimeout(() => K.coins.add(drops_, document.querySelector(".overlay .big-score")), 400);
  }
  function start() { layout(); score = 0; lives = 3; level = 1; shards = []; drops = []; $score.textContent = 0; $lvl.textContent = 1; drawHearts(); buildLevel(); reset(); playing = true; }
  layout(); level = 1; shards = []; drops = []; lives = 3; drawHearts(); buildLevel(); reset(); requestAnimationFrame(frame);
  K.panel({ title: "Стеклобой", text: "Двигай ракетку пальцем и разбивай стеклянные кирпичи. Белое стекло крепкое: бей по нему несколько раз. Лови бонусы!", buttons: [{ label: "Играть", cls: "big", onClick: start }] });
})();
</script>
</body>
</html>
