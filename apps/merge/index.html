<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Фруктовое слияние</title>
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="../../shared/k.css">
<link rel="stylesheet" href="merge.css">
<script src="../../shared/k.js"></script>
<script src="../../shared/matter.min.js"></script>
</head>
<body class="game-page">
<div class="hud" id="hud">
  <div class="stat glass score-stat"><b id="score" class="num">0</b><small>очки</small><i class="mult" id="mult" hidden>×2</i></div>
  <div class="stat glass" id="bestStat"><b id="best" class="num">0</b><small>рекорд</small></div>
  <div class="stat glass next-stat" aria-label="Следующий фрукт"><img id="nextImg" alt="" draggable="false"><small>далее</small></div>
  <button class="btn ghost pause-btn" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
</div>
<div class="missions" id="missions" aria-label="Миссии"></div>
<main class="stage" id="stage">
  <div class="jar" id="jar">
    <canvas id="c" aria-label="Корзина с фруктами"></canvas>
    <div class="newcard glass" id="newcard" hidden></div>
    <div class="tut" id="tut" hidden><img src="art/hand.webp" alt="" draggable="false"><span id="tutText">Веди пальцем и отпусти</span></div>
  </div>
  <button class="strip glass" id="strip" aria-label="Книга фруктов"><span class="strip-icons" id="stripIcons"></span><span class="strip-lbl"><img src="art/book.webp" alt="" draggable="false">Книга</span></button>
</main>
<script src="game.js"></script>
</body>
</html>
