<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Бадди — английский</title>
<meta name="theme-color" content="#f7f5f0">
<link rel="stylesheet" href="../../shared/fonts.css">
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="buddy-dog.js"></script>
<script src="course.js"></script>
<script src="../../shared/art/e/map.js"></script>
<style>
/* Тёплая гостиная Бадди: кремовый фон, медовые и небесные пятна света, мягкое стекло. */
:root {
  color-scheme: light;
  --bg: #f7f5f0; --bg2: #ebe5d8;
  --ink: #141414; --muted: #6f6a62; --faint: #a8a298; --line: rgba(20,20,20,.1);
  --glass: rgba(255,255,255,.6); --glass-hi: rgba(255,255,255,.9);
  --honey: #d6b15e; --honey-d: #9c7731; --orange: #1a1a1c; --orange-d: #000000;
  --green: #3fae7c; --green-d: #2b8a5f; --green-bg: #e3f4ea;
  --red: #e0675c; --red-d: #b84a40; --red-bg: #fbe7e4;
  --blue: #1a1a1c; --blue-d: #000000; --violet: #9c7731; --violet-d: #6e5320;
  --gold-grad: linear-gradient(100deg, #f3e3b0 0%, #d6b15e 38%, #9c7731 70%, #e6c97f 100%);
  --lock: #e4dfd4; --lock-d: #cbc3b3;
  --f: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --spring: cubic-bezier(.3,1.35,.5,1); --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--f); font-weight: 600; color: var(--ink); font-size: 16px; line-height: 1.4;
  background: radial-gradient(120% 70% at 50% -10%, #ffffff 0%, var(--bg) 45%, var(--bg2) 100%) fixed, var(--bg);
  overflow: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 14px; }
[hidden] { display: none !important; }
.ea { display: inline-block; width: 1.3em; height: 1.3em; object-fit: contain; vertical-align: -.28em; -webkit-user-drag: none; filter: drop-shadow(0 4px 6px rgba(40,30,10,.18)); }
.ea.big { width: 62%; height: auto; aspect-ratio: 1; vertical-align: middle; filter: drop-shadow(0 12px 14px rgba(40,30,10,.22)); }

.blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .55; animation: drift 24s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { width: 60vmax; height: 60vmax; left: -25vmax; top: -20vmax; background: #ead7a6; }
.blobs i:nth-child(2) { width: 45vmax; height: 45vmax; right: -20vmax; top: 25vh; background: #ffffff; animation-delay: -8s; }
.blobs i:nth-child(3) { width: 40vmax; height: 40vmax; left: 5vmax; bottom: -22vmax; background: #d9c39a; opacity: .35; animation-delay: -14s; }
@keyframes drift { to { transform: translate(5vmax, 4vmax) scale(1.1); } }

.glass {
  background: linear-gradient(150deg, rgba(255,255,255,.78), rgba(255,255,255,.45));
  -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  border: 1.5px solid rgba(255,255,255,.9); border-radius: 26px;
  box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 18px 40px -22px rgba(40,30,10,.35);
}

/* ---------- каркас ---------- */
#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.top {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin: max(10px, env(safe-area-inset-top, 0px)) auto 0; width: min(560px, calc(100% - 20px));
  padding: 6px 8px; border-radius: 999px;
}
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; font-weight: 900; font-size: 1rem; font-variant-numeric: tabular-nums; transition: transform .4s var(--spring); }
.pill .e { font-size: 1.2rem; line-height: 1; }
.pill.bump { animation: bump .6s var(--spring); }
@keyframes bump { 40% { transform: scale(1.35) rotate(-6deg); } }
.pill.bone { color: var(--ink); } .pill.cookie { color: var(--honey-d); } .pill.heart { color: var(--red-d); } .pill.cat { color: var(--violet-d); }
.pill.dim { opacity: .45; filter: grayscale(.8); }

main.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
.inner { width: min(560px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

nav.tabs {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 20px));
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 30px;
}
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 22px; font-size: .68rem; font-weight: 900; color: var(--muted); transition: background .25s, color .25s, transform .35s var(--spring); }
nav.tabs button .e { font-size: 1.45rem; line-height: 1.1; filter: grayscale(.4); transition: transform .4s var(--spring), filter .2s; }
nav.tabs button[aria-current="page"] { background: #141414; color: #f3e3b0; }
nav.tabs button[aria-current="page"] .e { transform: scale(1.18) translateY(-2px); filter: none; }
nav.tabs button:active { transform: scale(.9); }

/* ---------- кнопки как мармелад ---------- */
.btn {
  --c: #1a1a1c; --d: #000;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 24px; border-radius: 18px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 82%, white), var(--c)); color: #fff; font-weight: 900; font-size: 1.05rem; letter-spacing: .02em; 
  box-shadow: 0 5px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.45); transition: transform .08s, box-shadow .08s, filter .2s; text-shadow: 0 1px 0 rgba(0,0,0,.12);
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.45); }
.btn.wide { width: 100%; }
.btn.orange { --c: var(--orange); --d: var(--orange-d); }
.btn.green { --c: var(--green); --d: var(--green-d); }
.btn.blue { --c: var(--blue); --d: var(--blue-d); }
.btn.red { --c: var(--red); --d: var(--red-d); }
.btn.violet { --c: var(--violet); --d: var(--violet-d); }
.btn.honey { --c: var(--honey); --d: var(--honey-d); background: var(--gold-grad); color: #17130b; text-shadow: none; }
.btn.ghost { --d: var(--line); background: rgba(255,255,255,.75); color: var(--ink); box-shadow: 0 4px 0 rgba(122,74,31,.16); border: 2px solid rgba(122,74,31,.1); }
.btn:disabled { --c: var(--lock); --d: var(--lock-d); color: var(--faint); pointer-events: none; text-shadow: none; }
.btn.sm { min-height: 42px; padding: 0 16px; font-size: .9rem; border-radius: 14px; }

h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--honey-d); }

.buddy { display: block; width: 100%; height: auto; overflow: visible; }
.buddy-img { object-fit: contain; aspect-ratio: 1; filter: drop-shadow(0 16px 18px rgba(40,30,10,.22)); animation: bdbob 3.4s ease-in-out infinite; -webkit-user-drag: none; }
.buddy-img.bd-cheer { animation: hop .7s var(--ease) infinite alternate; }
@keyframes bdbob { 50% { transform: translateY(-4px) rotate(-1.5deg); } }
.buddy .bd-head { transform-origin: 100px 150px; animation: nod 4s ease-in-out infinite; }
.buddy .bd-tail { transform-origin: 146px 168px; animation: wag .45s ease-in-out infinite alternate; }
.buddy .bd-eyes { transform-origin: 100px 86px; animation: blink 5s infinite; }
.buddy.bd-cheer { animation: hop .7s var(--ease) infinite alternate; }
@keyframes nod { 50% { transform: rotate(-3deg) translateY(1px); } }
@keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes hop { to { transform: translateY(-8px); } }

/* ---------- путь уроков ---------- */
.unit-head { position: relative; overflow: hidden; padding: 16px 18px; border-radius: 26px; color: #fff; background: linear-gradient(135deg, color-mix(in srgb, var(--u) 88%, white), var(--u)); box-shadow: 0 6px 0 color-mix(in srgb, var(--u) 70%, black), 0 18px 30px -16px var(--u); display: flex; align-items: center; gap: 12px; }
.unit-head::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 90% at 15% 0%, rgba(255,255,255,.45), transparent 55%); pointer-events: none; }
.unit-head .uemo { font-size: 2.4rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,.2)); }
.unit-head small { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; opacity: .9; font-weight: 900; }
.unit-head h2 { font-size: 1.3rem; }
.unit-head.locked { --u: #cdb69e !important; }
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 58px 0 10px; }
.node-wrap { position: relative; display: flex; justify-content: center; }
.node {
  --c: var(--u); width: 76px; height: 70px; border-radius: 50%; font-size: 2rem; display: grid; place-items: center; position: relative;
  background: radial-gradient(80% 70% at 35% 25%, rgba(255,255,255,.6), transparent 55%), var(--c);
  box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 65%, black), inset 0 -4px 8px rgba(0,0,0,.12); transition: transform .1s;
}
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 65%, black); }
.node.done { --c: #d6b15e; }
.node.locked { --c: var(--lock); filter: saturate(.6); cursor: default; }
.node.locked .ic { opacity: .5; }
.node.current::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 5px solid color-mix(in srgb, var(--u) 50%, white); animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.08); opacity: .55; } }
.node .crown { position: absolute; right: -4px; bottom: -6px; font-size: 1.1rem; }
.start-bubble { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 8px 16px; border-radius: 999px; background: #141414; color: #f3e3b0; font-weight: 800; font-size: .85rem; letter-spacing: .04em; box-shadow: 0 4px 0 rgba(122,74,31,.14); animation: float 1.8s ease-in-out infinite; }
.start-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: #141414; }
@keyframes float { 50% { transform: translate(-50%, -5px); } }
.path-buddy { position: absolute; width: 96px; top: -18px; pointer-events: none; }
.fact-card { padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.fact-card .flag { font-size: 2rem; }

/* ---------- урок ---------- */
.lesson { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% -10%, #ffffff 0%, var(--bg) 50%, var(--bg2) 100%); animation: slideup .45s var(--ease); }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
.l-top { display: flex; align-items: center; gap: 12px; width: min(620px, calc(100% - 28px)); margin: max(14px, env(safe-area-inset-top, 0px)) auto 0; }
.l-close { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--faint); font-size: 1.6rem; }
.bar { flex: 1; height: 18px; border-radius: 999px; background: rgba(122,74,31,.12); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--gold-grad); box-shadow: inset 0 3px 0 rgba(255,255,255,.45); transition: width .5s var(--spring); }
.l-hearts { font-weight: 900; color: var(--red-d); display: flex; align-items: center; gap: 4px; }
.l-body { flex: 1; min-height: 0; overflow-y: auto; width: min(620px, 100%); margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.l-title { font-size: clamp(1.3rem, 5.5vw, 1.7rem); }
.tag-new { align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: var(--gold-grad); color: #17130b; font-size: .75rem; letter-spacing: .1em; font-weight: 900; }
.say-row { display: flex; align-items: flex-end; gap: 10px; }
.say-row .mini { width: 92px; flex: none; }
.bubble { position: relative; flex: 1; padding: 14px 16px; border-radius: 20px; border: 2px solid var(--line); background: #fff; font-size: 1.25rem; font-weight: 800; }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 18px; border: 10px solid transparent; border-right-color: #fff; border-left: 0; filter: drop-shadow(-2px 0 0 var(--line)); }
.speak { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); margin-right: 8px; vertical-align: middle; flex: none; }
.speak:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-d); }
.speak svg { width: 24px; height: 24px; }
.speak.big { width: 96px; height: 96px; border-radius: 28px; }
.speak.big svg { width: 50px; height: 50px; }

.choices { display: grid; gap: 10px; }
.choices.pics { grid-template-columns: 1fr 1fr; }
.choice { min-height: 60px; padding: 12px 16px; border-radius: 18px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-weight: 800; font-size: 1.1rem; text-align: left; transition: transform .1s, border-color .15s, background .15s; animation: pop .45s var(--spring) both; }
.choices .choice:nth-child(2) { animation-delay: .05s; } .choices .choice:nth-child(3) { animation-delay: .1s; } .choices .choice:nth-child(4) { animation-delay: .15s; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choice.sel { border-color: #141414; background: #f6f1e4; box-shadow: 0 4px 0 #d6c9a8; color: var(--ink); }
.choice.ok { border-color: var(--green); background: var(--green-bg); box-shadow: 0 4px 0 #9fe4c3; color: var(--green-d); }
.choice.bad { border-color: var(--red); background: var(--red-bg); box-shadow: 0 4px 0 #f6b0b7; color: var(--red-d); }
.choice.gone { opacity: .25; pointer-events: none; transform: scale(.94); }
.choice.pic { aspect-ratio: 1 / .9; display: grid; place-items: center; font-size: clamp(3rem, 15vw, 4.2rem); text-align: center; padding: 6px; }
.choice.pic small { display: block; font-size: .9rem; color: var(--muted); }
.match { grid-template-columns: 1fr 1fr; }
.match .choice { text-align: center; font-size: 1rem; }

.intro-card { padding: 26px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.intro-card .pic { font-size: 5.5rem; line-height: 1.1; animation: pop .6s var(--spring); }
.intro-card .en { font-family: var(--f-display); font-size: 2rem; font-weight: 700; color: var(--ink); }
.intro-card .ru { font-size: 1.2rem; color: var(--muted); }

.answer-line { min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 10px 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { padding: 10px 14px; border-radius: 14px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-weight: 800; font-size: 1.05rem; animation: pop .35s var(--spring) both; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tile.ghost { background: rgba(122,74,31,.08); color: transparent; box-shadow: none; border-color: transparent; pointer-events: none; }

.l-foot { flex: none; padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 2px solid var(--line); transition: background .25s; }
.l-foot .in { width: min(620px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.l-foot.ok { background: var(--green-bg); border-top-color: transparent; }
.l-foot.bad { background: var(--red-bg); border-top-color: transparent; }
.fb { display: flex; align-items: center; gap: 12px; animation: slideup .3s var(--ease); }
.fb .ic { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 1.7rem; flex: none; }
.fb b { font-size: 1.3rem; display: block; }
.l-foot.ok .fb { color: var(--green-d); } .l-foot.bad .fb { color: var(--red-d); } .fb b { font-family: var(--f-display); font-weight: 700; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* ---------- экраны и карточки ---------- */
.card { padding: 16px; }
.quest { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 14px; }
.quest .qe { font-size: 2rem; text-align: center; }
.qbar { height: 14px; border-radius: 999px; background: rgba(122,74,31,.12); overflow: hidden; margin-top: 6px; }
.qbar i { display: block; height: 100%; border-radius: inherit; background: var(--gold-grad); }
.quest.claimed { opacity: .6; }
.shop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.item { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.item .prev { width: 110px; }
.item .price { font-weight: 900; color: #a8641c; }
.plus { position: relative; overflow: hidden; padding: 22px; border-radius: 28px; color: #f6f4ef; background: radial-gradient(120% 90% at 0% 0%, #2b2b31, #0d0d10 70%); box-shadow: inset 0 0 0 1px rgba(214,177,94,.4), 0 24px 50px -24px rgba(0,0,0,.6); }
.plus::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 20% 0%, rgba(255,255,255,.45), transparent 60%); pointer-events: none; }
.plus ul { margin: 10px 0 14px; padding-left: 20px; line-height: 1.7; }
.chip { display: inline-flex; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.3); font-size: .78rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px; display: flex; gap: 10px; align-items: center; }
.stat .e { font-size: 1.8rem; } .stat b { font-size: 1.35rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; } .stat small { color: var(--muted); font-size: .8rem; }
.ach { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ach div { padding: 12px 6px; text-align: center; border-radius: 20px; font-size: .74rem; color: var(--muted); }
.ach div span { display: block; font-size: 2rem; }
.ach div.no span { filter: grayscale(1); opacity: .35; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { padding: 13px 14px; border-radius: 14px; border: 2px solid var(--line); background: #fff; font-weight: 700; }
.field small { color: var(--muted); font-weight: 600; }

/* ---------- чат ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; padding: 12px 14px; border-radius: 20px; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; animation: pop .35s var(--spring) both; }
.msg.me { align-self: flex-end; background: #141414; color: #f6f4ef; border-bottom-right-radius: 6px; }
.msg.bot { align-self: flex-start; background: #fff; border: 2px solid var(--line); border-bottom-left-radius: 6px; }
.msg.bot .s { margin-left: 6px; color: var(--blue-d); font-size: .85rem; }
.typing span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin: 0 2px; animation: dot 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-5px); opacity: .5; } }
.composer { position: fixed; z-index: 19; left: 50%; transform: translateX(-50%); width: min(540px, calc(100% - 20px)); bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + 78px); display: flex; gap: 8px; padding: 8px; border-radius: 24px; }
.composer input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 10px; font-weight: 700; outline: none; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.quick button { flex: none; padding: 8px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-weight: 800; font-size: .9rem; }

/* ---------- окна ---------- */

<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div id="app">

</div>
<canvas id="fx"></canvas>
<script>
(() => {
"use strict";
const C = window.BUDDY_COURSE;
const ART = "../../shared/art/";
const A = (n, cls = "") => `<img class="ea ${cls}" src="${ART}${n}.webp" alt="" draggable="false">`;
const E = (e, cls = "") => (window.EMOJI_ART && EMOJI_ART[e]) ? `<img class="ea ${cls}" src="${ART}e/${EMOJI_ART[e]}.webp" alt="" draggable="false">` : e;
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; };
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const daysDiff = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);

/* ================= состояние ================= */
const KEY = "buddy-english-v1";
const MAX_HEARTS = 5, HEART_MIN = 20, CAT_PRICE = 60, MAX_CATS = 3;
const CAT_NAMES = ["Мурзик", "Тоффи", "Пушок", "Ириска", "Персик"];
function fresh() {
  return { v: 1, name: "", goal: 2, xp: 0, cookies: 30, hearts: MAX_HEARTS, heartsAt: Date.now(), streak: 0, bestStreak: 0, lastDay: "", cats: [],
    outfit: null, owned: [], progress: {}, perfect: 0, lessons: 0, learned: [], chat: [], apiKey: "", proxyUrl: "", sound: true,
    quests: { day: "", c: {}, claimed: {} }, ach: {} };
}
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "null") || {}); } catch (e) { S = fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* хранилище недоступно */ } }

/* сердечки восстанавливаются со временем */
function refillHearts() {
  if (S.hearts >= MAX_HEARTS) { S.heartsAt = Date.now(); return; }
  const n = Math.floor((Date.now() - S.heartsAt) / (HEART_MIN * 60000));
  if (n > 0) { S.hearts = Math.min(MAX_HEARTS, S.hearts + n); S.heartsAt += n * HEART_MIN * 60000; if (S.hearts >= MAX_HEARTS) S.heartsAt = Date.now(); }
}
/* косточки (серия) и котики-хранители */
function checkStreak() {
  const today = dayKey();
  if (!S.lastDay || S.lastDay === today) return null;
  const gap = daysDiff(S.lastDay, today);
  if (gap <= 1) return null;
  const missed = gap - 1;
  if (S.streak > 0 && S.cats.length >= missed) {
    const used = S.cats.splice(0, missed);
    S.lastDay = dayKey(new Date(Date.now() - 864e5)); // будто занимался вчера
    save();
    return { saved: true, used };
  }
  const lost = S.streak; S.streak = 0; save();
  return lost ? { saved: false, lost } : null;
}
function questsToday() {
  const t = dayKey();
  if (S.quests.day !== t) S.quests = { day: t, c: {}, claimed: {} };
  return S.quests;
}
function bumpQuest(k, n = 1) { const q = questsToday(); q.c[k] = (q.c[k] || 0) + n; save(); }

/* ================= звук и речь ================= */
let ac = null;
function tone(f, t, d, type = "sine", v = .16) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(v, ac.currentTime + t + .015); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t + d);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d + .05);
  } catch (e) { /* без звука */ }
}
const sfx = {
  tap: () => tone(700, 0, .06, "triangle", .08),
  ok: () => { tone(784, 0, .12, "triangle"); tone(1175, .09, .22, "triangle"); },
  bad: () => { tone(220, 0, .18, "square", .06); tone(180, .1, .22, "square", .05); },
  win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, i * .09, .3, "triangle", .14)),
  coin: () => { tone(1320, 0, .07, "square", .05); tone(1760, .06, .14, "square", .05); },
  woof: () => { tone(330, 0, .09, "sawtooth", .07); tone(260, .05, .12, "sawtooth", .06); }
};
function speak(text) {
  const clean = String(text).replace(/\([^)]*\)/g, "").replace(/[А-Яа-яЁё]+/g, "").trim();
  if (!clean) return;
  try {
    if (window.KaplyaNative && KaplyaNative.speak) { KaplyaNative.speak(clean); return; }
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean); u.lang = "en-GB"; u.rate = .85; u.pitch = 1.15;
    const v = speechSynthesis.getVoices().find((x) => /^en[-_]GB/i.test(x.lang)) || speechSynthesis.getVoices().find((x) => /^en/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { /* без озвучки */ }
}
const SPK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>`;

/* ================= эффекты ================= */
const fx = $("#fx"), fxc = fx.getContext("2d"); let parts = [], fxOn = false;
function fxSize() { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; fxc.setTransform(d, 0, 0, d, 0, 0); }
fxSize(); addEventListener("resize", fxSize);
function confetti(n = 120, x = innerWidth / 2, y = innerHeight * .35) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#ffb547", "#ff8a3d", "#3ccf91", "#4fb3ff", "#ff5d7a", "#b27cff"];
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 8; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, r: 4 + Math.random() * 5, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 1 }); }
  if (!fxOn) { fxOn = true; requestAnimationFrame(fxTick); }
}
function fxTick() {
  fxc.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
  for (const p of parts) { p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .008; fxc.globalAlpha = Math.min(1, p.life * 2); fxc.fillStyle = p.c; fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.rot); fxc.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); fxc.restore(); }
  fxc.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(fxTick); else { fxOn = false; fxc.clearRect(0, 0, innerWidth, innerHeight); }
}
function toast(t) { const d = document.createElement("div"); d.className = "toast glass"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3100); }
function bump(id) { const el = $(id); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function modal(html, onMount) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="panel glass" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  onMount && onMount(m, close);
  return close;
}

/* ================= верхняя панель ================= */
function paintTop() {
  refillHearts();
  $("#pBone span:last-child").textContent = S.streak;
  $("#pBone").classList.toggle("dim", S.lastDay !== dayKey());
  $("#pCookie span:last-child").textContent = S.cookies;
  $("#pCat span:last-child").textContent = S.cats.length;
  $("#pHeart span:last-child").textContent = S.hearts;
}

/* ================= путь уроков ================= */
const LESSONS = [{ n: "Новые слова", ic: "⭐" }, { n: "Ещё слова", ic: "📚" }, { n: "Фразы", ic: "💬" }, { n: "Всё вместе", ic: "🎧" }, { n: "Проверка", ic: "🏆" }];
const unitDone = (u) => (S.progress[u.id] || 0) >= LESSONS.length;
const unitOpen = (i) => i === 0 || unitDone(C[i - 1]);
function current() { for (let i = 0; i < C.length; i++) if (unitOpen(i) && !unitDone(C[i])) return [i, S.progress[C[i].id] || 0]; return [C.length - 1, LESSONS.length]; }
const OFFS = [0, 56, 76, 46, -10];

function renderLearn() {
  const [cu, cl] = current();
  let h = `<div class="inner">`;
  h += `<div class="glass card row" style="flex-wrap:nowrap"><div style="width:84px;flex:none">${buddyArt({ mood: S.lastDay === dayKey() ? "cheer" : "happy", outfit: S.outfit })}</div>
    <div><div class="eyebrow">${S.lastDay === dayKey() ? "Сегодня ты молодец" : "Привет" + (S.name ? ", " + esc(S.name) : "") + "!"}</div>
    <div style="font-weight:800">${S.lastDay === dayKey() ? `Серия: ${S.streak} ${plural(S.streak, "косточка", "косточки", "косточек")} ${A("bone")} Возвращайся завтра!` : S.streak ? `Пройди урок, чтобы получить ${S.streak + 1}-ю косточку ${A("bone")}` : `Пройди первый урок и получи косточку ${A("bone")}`}</div></div></div>`;
  C.forEach((u, i) => {
    const open = unitOpen(i), done = S.progress[u.id] || 0;
    h += `<section style="--u:${u.color}">
      <div class="unit-head ${open ? "" : "locked"}"><span class="uemo">${open ? E(u.emoji) : A("lock")}</span><div><small>Раздел ${i + 1}</small><h2>${u.title}</h2></div></div>
      <div class="path">`;
    LESSONS.forEach((L, k) => {
      const isDone = k < done, isCur = open && i === cu && k === cl, locked = !open || k > done;
      h += `<div class="node-wrap" style="transform:translateX(${OFFS[k]}px)">
        ${isCur ? `<div class="start-bubble">${k === 0 && i === 0 && !S.lessons ? "Начать" : "Дальше"}</div>` : ""}
        <button class="node ${isDone ? "done" : ""} ${isCur ? "current" : ""} ${locked && !isDone ? "locked" : ""}" data-u="${i}" data-l="${k}" aria-label="${u.title}: ${L.n}${locked && !isDone ? " (закрыто)" : ""}">
          <span class="ic">${locked && !isDone ? A("lock") : isDone ? (k === 4 ? A("trophy") : "✓") : E(L.ic)}</span>${isDone ? `<span class="crown">${A("crown")}</span>` : ""}</button>
        ${isCur ? `<div class="path-buddy" style="${OFFS[k] > 20 ? "right:110px" : "left:110px"}">${buddyArt({ mood: "happy", outfit: S.outfit })}</div>` : ""}
      </div>`;
    });
    h += `</div>`;
    if (unitDone(u)) h += `<div class="glass fact-card"><span class="flag">${A(i % 2 ? "flag-us" : "flag-gb")}</span><div><div class="eyebrow">Бадди рассказывает</div>${u.fact}</div></div>`;
    h += `</section>`;
  });
  h += `<button class="btn honey wide" id="practice">${A("notebook")} Повторение (+1 ${A("heart")}, +10 ${A("cookie")})</button></div>`;
  view.innerHTML = h;
  view.querySelectorAll(".node").forEach((b) => b.addEventListener("click", () => {
    const i = +b.dataset.u, k = +b.dataset.l, done = S.progress[C[i].id] || 0;
    if (!unitOpen(i) || k > done) { sfx.bad(); toast("Сначала пройди предыдущие уроки 🐾"); return; }
    sfx.tap(); startLesson(i, k);
  }));
  $("#practice").onclick = () => startLesson(-1, 0);
  const cur = view.querySelector(".node.current"); cur && setTimeout(() => cur.scrollIntoView({ block: "center", behavior: "smooth" }), 80);
}

/* ================= генерация урока ================= */
function wordTasks(u, words, all) {
  const T = [];
  words.forEach((w, i) => {
    const kind = ["pic", "en2ru", "ru2en", "listen"][i % 4];
    T.push({ t: kind, w, pool: all });
  });
  return T;
}
function makeLesson(ui, k) {
  if (ui < 0) { // повторение по пройденным разделам
    const units = C.filter((u, i) => unitOpen(i) && (S.progress[u.id] || 0) > 0);
    const src = units.length ? units : [C[0]];
    const T = [];
    for (let i = 0; i < 8; i++) { const u = src[(Math.random() * src.length) | 0], w = u.words[(Math.random() * 8) | 0]; T.push({ t: ["pic", "en2ru", "ru2en", "listen"][i % 4], w, pool: u.words }); }
    const u = src[(Math.random() * src.length) | 0]; T.push({ t: "match", pairs: pick(u.words, 4) }, { t: "build", p: pick(u.phrases, 1)[0], all: u.phrases });
    return shuffle(T);
  }
  const u = C[ui], W = u.words, P = u.phrases;
  if (k === 0 || k === 1) {
    const ws = W.slice(k * 4, k * 4 + 4), pool = W;
    return [
      { t: "intro", w: ws[0] }, { t: "intro", w: ws[1] }, { t: "pic", w: ws[0], pool }, { t: "pic", w: ws[1], pool },
      { t: "intro", w: ws[2] }, { t: "intro", w: ws[3] }, { t: "en2ru", w: ws[2], pool }, { t: "listen", w: ws[3], pool },
      { t: "ru2en", w: ws[0], pool }, { t: "match", pairs: ws }, { t: "pic", w: ws[2], pool }, { t: "ru2en", w: ws[3], pool }
    ];
  }
  if (k === 2) {
    const ps = shuffle(P);
    return [
      { t: "pchoose", p: ps[0], all: P }, { t: "build", p: ps[0], all: P }, { t: "build", p: ps[1], all: P }, { t: "pchoose", p: ps[2], all: P },
      { t: "lbuild", p: ps[1], all: P }, { t: "build", p: ps[2], all: P }, { t: "build", p: ps[3], all: P }, { t: "lbuild", p: ps[4 % ps.length], all: P },
      { t: "match", pairs: pick(W, 4) }
    ];
  }
  const n = k === 3 ? 10 : 12;
  const T = shuffle([...wordTasks(u, pick(W, 6), W), { t: "match", pairs: pick(W, 4) }, ...pick(P, 3).map((p, i) => ({ t: i % 2 ? "lbuild" : "build", p, all: P })), { t: "pchoose", p: pick(P, 1)[0], all: P }, { t: "pic", w: pick(W, 1)[0], pool: W }]);
  return T.slice(0, n);
}

/* ================= урок ================= */
let L = null;
function startLesson(ui, k) {
  refillHearts();
  if (S.hearts <= 0 && ui >= 0) return noHearts(false);
  L = { ui, k, tasks: makeLesson(ui, k), i: 0, total: 0, right: 0, wrong: 0, t0: Date.now(), state: "ask", answer: null, redo: [] };
  L.total = L.tasks.filter((t) => t.t !== "intro").length;
  const el = document.createElement("div"); el.className = "lesson"; el.id = "lesson";
  el.innerHTML = `<div class="l-top"><button class="l-close" id="lx" aria-label="Закрыть урок">✕</button><div class="bar"><i id="lbar" style="width:0"></i></div><div class="l-hearts">${A("heart")} <span id="lh">${S.hearts}</span></div></div>
    <div class="l-body" id="lb"></div><div class="l-foot" id="lf"><div class="in"></div></div>`;
  document.body.appendChild(el);
  $("#lx").onclick = () => modal(`<div class="hero">${buddyArt({ mood: "oops", outfit: S.outfit })}</div><h2>Уже уходишь?</h2><p class="muted">Если выйти сейчас, прогресс урока не сохранится.</p>
    <button class="btn wide" data-a="stay">Остаться</button><button class="btn ghost wide" data-a="quit">Выйти</button>`, (m, close) => {
      m.querySelector('[data-a="stay"]').onclick = close;
      m.querySelector('[data-a="quit"]').onclick = () => { close(); endLesson(); };
    });
  showTask();
}
function endLesson() { const el = $("#lesson"); el && el.remove(); L = null; paintTop(); render(); }
function setBar() { const done = L.right; $("#lbar").style.width = Math.min(100, done / L.total * 100) + "%"; }

function foot(html, cls = "") { const f = $("#lf"); f.className = "l-foot " + cls; f.querySelector(".in").innerHTML = html; return f; }
function checkBtn(enabled) { foot(`<button class="btn wide" id="chk" ${enabled ? "" : "disabled"}>Проверить</button>`); if (enabled) $("#chk").onclick = check; }

function showTask() {
  const T = L.tasks[L.i]; L.state = "ask"; L.answer = null; setBar();
  const b = $("#lb"); b.scrollTop = 0;
  const mini = (mood = "happy") => `<div class="mini">${buddyArt({ mood, outfit: S.outfit })}</div>`;
  switch (T.t) {
    case "intro":
      b.innerHTML = `<span class="tag-new">НОВОЕ СЛОВО</span><div class="glass intro-card"><div class="pic">${E(T.w[2], "big")}</div><div class="en">${esc(T.w[0])}</div><div class="ru">${esc(T.w[1])}</div><button class="speak" id="sp" aria-label="Послушать">${SPK}</button></div>`;
      $("#sp").onclick = () => speak(T.w[0]); speak(T.w[0]);
      foot(`<button class="btn wide blue" id="nx">Запомнил!</button>`); $("#nx").onclick = next; return;
    case "pic": {
      const opts = shuffle([T.w, ...pick(T.pool.filter((x) => x !== T.w && x[2] !== T.w[2]), 3)]);
      b.innerHTML = `<h1 class="l-title">Где <span style="color:var(--blue-d)">«${esc(T.w[0])}»</span>?</h1>
        <div class="choices pics">${opts.map((o) => `<button class="choice pic" data-v="${esc(o[0])}">${E(o[2], "big")}</button>`).join("")}</div>`;
      speak(T.w[0]); bindChoices(T.w[0]); return;
    }
    case "en2ru": case "ru2en": case "listen": {
      const en = T.t !== "ru2en";
      const opts = shuffle([T.w, ...pick(T.pool.filter((x) => x !== T.w), 3)]);
      const title = T.t === "listen" ? "Что сказал Бадди?" : en ? "Как это по-русски?" : "Как это по-английски?";
      const said = T.t === "listen" ? `<button class="speak big" id="sp" aria-label="Послушать ещё раз">${SPK}</button>` : `${en ? `<button class="speak" id="sp" aria-label="Послушать">${SPK}</button>` : ""}${esc(en ? T.w[0] : T.w[1])}`;
      b.innerHTML = `<h1 class="l-title">${title}</h1>${T.t === "listen" ? `<div style="display:flex;justify-content:center;gap:16px;align-items:center">${mini()}${said}</div>` : `<div class="say-row">${mini()}<div class="bubble">${said}</div></div>`}
        <div class="choices">${opts.map((o) => `<button class="choice" data-v="${esc(o[0])}">${esc(T.t === "en2ru" ? o[1] : o[0])}</button>`).join("")}</div>`;
      const sp = $("#sp"); if (sp) sp.onclick = () => speak(T.w[0]);
      if (en) speak(T.w[0]);
      bindChoices(T.w[0], T.t !== "en2ru"); return;
    }
    case "pchoose": {
      const opts = shuffle([T.p, ...pick(T.all.filter((x) => x !== T.p), 2)]);
      b.innerHTML = `<h1 class="l-title">Выбери перевод</h1><div class="say-row">${mini()}<div class="bubble"><button class="speak" id="sp" aria-label="Послушать">${SPK}</button>${esc(T.p[0])}</div></div>
        <div class="choices">${opts.map((o) => `<button class="choice" data-v="${esc(o[0])}">${esc(o[1])}</button>`).join("")}</div>`;
      $("#sp").onclick = () => speak(T.p[0]); speak(T.p[0]);
      bindChoices(T.p[0]); return;
    }
    case "build": case "lbuild": {
      const words = T.p[0].replace(/[?,.!]/g, "").split(" ");
      const extra = pick([...new Set(T.all.flatMap((p) => p[0].replace(/[?,.!]/g, "").split(" ")))].filter((w) => !words.includes(w)), 3);
      const bank = shuffle([...words, ...extra]).map((w, i) => ({ w, i }));
      L.built = [];
      b.innerHTML = `<h1 class="l-title">${T.t === "lbuild" ? "Собери то, что услышал" : "Переведи фразу"}</h1>
        ${T.t === "lbuild" ? `<div style="display:flex;justify-content:center;gap:16px;align-items:center">${mini()}<button class="speak big" id="sp" aria-label="Послушать">${SPK}</button></div>` : `<div class="say-row">${mini()}<div class="bubble">${esc(T.p[1])}</div></div>`}
        <div class="answer-line" id="al"></div><div class="bank" id="bk">${bank.map((x) => `<button class="tile" data-i="${x.i}">${esc(x.w)}</button>`).join("")}</div>`;
      if (T.t === "lbuild") { $("#sp").onclick = () => speak(T.p[0]); speak(T.p[0]); }
      const al = $("#al"), bk = $("#bk");
      bk.querySelectorAll(".tile").forEach((t) => t.addEventListener("click", () => {
        if (L.state !== "ask" || t.classList.contains("ghost")) return;
        sfx.tap(); speak(t.textContent);
        t.classList.add("ghost");
        const a = document.createElement("button"); a.className = "tile"; a.textContent = t.textContent; a.dataset.i = t.dataset.i;
        a.onclick = () => { if (L.state !== "ask") return; a.remove(); t.classList.remove("ghost"); L.answer = [...al.children].map((x) => x.textContent).join(" "); checkBtn(!!al.children.length); };
        al.appendChild(a); L.answer = [...al.children].map((x) => x.textContent).join(" "); checkBtn(true);
      }));
      checkBtn(false); return;
    }
    case "match": {
      const left = shuffle(T.pairs), right = shuffle(T.pairs);
      b.innerHTML = `<h1 class="l-title">Найди пары</h1><div class="choices match">${left.map((p, i) => `<button class="choice" data-side="en" data-v="${esc(p[0])}" style="grid-column:1;grid-row:${i + 1}">${esc(p[0])}</button>`).join("")}${right.map((p, i) => `<button class="choice" data-side="ru" data-v="${esc(p[0])}" style="grid-column:2;grid-row:${i + 1}">${esc(p[1])}</button>`).join("")}</div>`;
      let sel = null, left_ = T.pairs.length, mistakes = 0;
      b.querySelectorAll(".choice").forEach((c) => c.addEventListener("click", () => {
        if (c.classList.contains("gone")) return;
        if (c.dataset.side === "en") speak(c.dataset.v);
        if (!sel || sel.dataset.side === c.dataset.side) { sel && sel.classList.remove("sel"); sel = c; c.classList.add("sel"); sfx.tap(); return; }
        if (sel.dataset.v === c.dataset.v) {
          [sel, c].forEach((x) => { x.classList.remove("sel"); x.classList.add("ok"); setTimeout(() => x.classList.add("gone"), 350); });
          sfx.ok(); left_--; sel = null;
          if (!left_) { L.state = "done"; L.right++; setBar(); bumpQuest("answers"); setTimeout(() => feedback(true, mistakes ? "Все пары найдены!" : "Идеально!"), 300); }
        } else {
          mistakes++; sfx.bad(); [sel, c].forEach((x) => { x.classList.add("bad", "shake"); setTimeout(() => x.classList.remove("bad", "shake", "sel"), 450); }); sel = null;
        }
      }));
      foot(`<div class="muted" style="text-align:center">Нажми на слово, потом на его перевод</div>`); return;
    }
  }
}
function bindChoices(correct, sayOnTap) {
  const b = $("#lb");
  b.querySelectorAll(".choice").forEach((c) => c.addEventListener("click", () => {
    if (L.state !== "ask") return;
    b.querySelectorAll(".choice").forEach((x) => x.classList.remove("sel"));
    c.classList.add("sel"); L.answer = c.dataset.v; sfx.tap();
    if (sayOnTap) speak(c.dataset.v);
    checkBtn(true);
  }));
  L.correct = correct;
  checkBtn(false);
}
const norm = (s) => String(s).toLowerCase().replace(/[?,.!]/g, "").replace(/\s+/g, " ").trim();
function check() {
  if (L.state !== "ask") return;
  const T = L.tasks[L.i];
  const target = T.p ? T.p[0] : T.w[0];
  const ok = norm(L.answer) === norm(target);
  L.state = "done";
  const b = $("#lb");
  b.querySelectorAll(".choice").forEach((c) => { if (c.dataset.v === target) c.classList.add("ok"); else if (c.classList.contains("sel")) c.classList.add("bad", "shake"); c.classList.remove("sel"); });
  if (ok) { L.right++; bumpQuest("answers"); setBar(); }
  else {
    L.wrong++;
    if (L.ui >= 0) { S.hearts = Math.max(0, S.hearts - 1); if (S.hearts < MAX_HEARTS && S.hearts === MAX_HEARTS - 1) S.heartsAt = Date.now(); save(); $("#lh").textContent = S.hearts; }
    L.tasks.push(T); // повторим в конце, как в настоящем курсе
  }
  feedback(ok, ok ? "" : T.p ? T.p[0] : `${T.w[0]} — ${T.w[1]}`);
}
const PRAISE = ["Отлично!", "Супер!", "Молодец!", "Так держать!", "Woof! Верно!", "Excellent!"];
function feedback(ok, extra) {
  ok ? sfx.ok() : sfx.bad();
  try { navigator.vibrate && navigator.vibrate(ok ? 12 : [30, 40, 30]); } catch (e) { /* нет вибрации */ }
  foot(`<div class="fb"><span class="ic">${A(ok ? "bone" : "thinking")}</span><div><b>${ok ? PRAISE[(Math.random() * PRAISE.length) | 0] : "Правильно так:"}</b>${extra ? `<span>${esc(extra)}</span>` : ""}</div></div>
    <button class="btn wide ${ok ? "green" : "red"}" id="nx">Дальше</button>`, ok ? "ok" : "bad");
  $("#nx").onclick = () => { if (!ok && L.ui >= 0 && S.hearts <= 0) return noHearts(true); next(); };
}
function next() { sfx.tap(); L.i++; if (L.i >= L.tasks.length) finishLesson(); else showTask(); }

function noHearts(inLesson) {
  modal(`<div class="hero">${buddyArt({ mood: "sleep", outfit: S.outfit })}</div><h2>Сердечки закончились</h2>
    <p class="muted">Бадди немного устал. Новое сердечко появится через ${HEART_MIN} минут, или сделай доп. задание.</p>
    <button class="btn honey wide" data-a="practice">🔁 Повторение (+1 ❤️)</button>
    <button class="btn wide" data-a="buy" ${S.cookies < 30 ? "disabled" : ""}>Восстановить за 30 🍪</button>
    <button class="btn ghost wide" data-a="close">Позже</button>`, (m, close) => {
    m.querySelector('[data-a="practice"]').onclick = () => { close(); endLesson(); startLesson(-1, 0); };
    m.querySelector('[data-a="buy"]').onclick = () => { S.cookies -= 30; S.hearts = MAX_HEARTS; save(); close(); paintTop(); bump("#pHeart"); sfx.coin(); const lh = $("#lh"); if (lh) lh.textContent = S.hearts; if (inLesson && L) next(); };
    m.querySelector('[data-a="close"]').onclick = () => { close(); if (inLesson) endLesson(); };
  });
}

function finishLesson() {
  const practice = L.ui < 0, perfect = L.wrong === 0, secs = Math.round((Date.now() - L.t0) / 1000);
  const xp = practice ? 8 : 10 + (perfect ? 5 : 0) + (L.k === 4 ? 10 : 0);
  let cookies = practice ? 10 : 5 + (perfect ? 5 : 0);
  S.xp += xp; S.cookies += cookies; S.lessons++;
  if (perfect && !practice) S.perfect++;
  if (practice) { S.hearts = Math.min(MAX_HEARTS, S.hearts + 1); bumpQuest("practice"); }
  else {
    const u = C[L.ui]; if ((S.progress[u.id] || 0) === L.k) S.progress[u.id] = L.k + 1;
    if (L.k <= 1) u.words.slice(L.k * 4, L.k * 4 + 4).forEach((w) => { if (!S.learned.includes(w[0])) S.learned.push(w[0]); });
  }
  bumpQuest("lessons"); bumpQuest("xp", xp); if (perfect) bumpQuest("perfect");
  const today = dayKey(), newDay = S.lastDay !== today;
  if (newDay) { S.streak++; S.lastDay = today; S.bestStreak = Math.max(S.bestStreak, S.streak); }
  save();
  const unitFinished = !practice && L.k === 4;
  const ui = L.ui;
  $("#lesson").remove(); L = null;
  sfx.win(); confetti();
  modal(`<div class="hero">${buddyArt({ mood: "cheer", outfit: S.outfit })}</div>
    <h2>${unitFinished ? "Раздел пройден!" : perfect ? "Без единой ошибки!" : practice ? "Повторение — мать учения!" : "Урок пройден!"}</h2>
    <div class="results"><div style="--c:var(--honey-d)">Опыт<b>+${xp} XP</b></div><div style="--c:#a8641c">Печеньки<b>+${cookies} 🍪</b></div><div style="--c:var(--green-d)">Время<b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</b></div></div>
    ${newDay ? `<div class="bone-burst">${A("bone")}</div><b style="color:var(--orange-d);font-size:1.2rem">Серия: ${S.streak} ${plural(S.streak, "день", "дня", "дней")} подряд!</b>` : ""}
    ${practice ? `<p class="muted">+1 ${A("heart")} за повторение</p>` : ""}
    ${unitFinished ? `<div class="glass fact-card" style="text-align:left"><span class="flag">${A(ui % 2 ? "flag-us" : "flag-gb")}</span><div><div class="eyebrow">Бадди рассказывает</div>${C[ui].fact}</div></div>` : ""}
    <button class="btn wide" data-a="ok">Продолжить</button>`, (m, close) => { m.querySelector('[data-a="ok"]').onclick = () => { close(); render(); paintTop(); bump("#pCookie"); if (newDay) bump("#pBone"); checkAch(); }; });
}

}

/* ================= ИИ-чат через OpenRouter ================= */
const SYSTEM = `You are Buddy, a kind and cheerful puppy from London who teaches English to Russian-speaking children aged 8-11 (A1 level).
Rules:
- Answer in very simple English, 1-3 short sentences. After hard words add the Russian translation in brackets, e.g. "a bridge (мост)".
- If the child writes in Russian, answer in simple English and add a short Russian translation of your whole answer in brackets.
- Gently correct mistakes: show the correct sentence once, then praise.
- Always end with one easy question to keep the chat going.
- You love tea, London, New York, bones and naps. You are playful and warm, sometimes say "Woof!".
- Keep everything child-safe. Never ask for personal data (address, phone, school, photos). If a topic is not for children, kindly change the subject to learning English.`;
const OR = "https://openrouter.ai/api/v1";
const FALLBACK_MODELS = ["openrouter/free", "meta-llama/llama-3.3-70b-instruct:free", "google/gemma-3-27b-it:free", "mistralai/mistral-small-3.2-24b-instruct:free", "qwen/qwen3-235b-a22b:free", "deepseek/deepseek-chat-v3-0324:free"];
async function freeModels() {
  try {
    const c = JSON.parse(localStorage.getItem("buddy-models") || "null");
    if (c && Date.now() - c.t < 864e5 && c.list.length) return c.list;
  } catch (e) { /* нет кэша */ }
  try {
    const r = await fetch(OR + "/models"); const j = await r.json();
    const free = (j.data || []).filter((m) => (m.id.endsWith(":free") || (m.pricing && +m.pricing.prompt === 0 && +m.pricing.completion === 0)) && (m.context_length || 0) >= 8000 && !/vision|vl|image|audio|embed|guard/i.test(m.id))
      .sort((a, b) => score(b) - score(a)).map((m) => m.id);
    const list = [...new Set([...free.filter((id) => id === "openrouter/free"), ...free, ...FALLBACK_MODELS])].slice(0, 8);
    try { localStorage.setItem("buddy-models", JSON.stringify({ t: Date.now(), list })); } catch (e) { /* без кэша */ }
    return list;
  } catch (e) { return FALLBACK_MODELS; }
  function score(m) { const id = m.id; return (/llama|gemma|mistral|qwen|deepseek/i.test(id) ? 50 : 0) + (/instruct|chat|it/i.test(id) ? 10 : 0) + Math.min(30, (m.context_length || 0) / 4000); }
}
async function askBuddy(history) {
  const msgs = [{ role: "system", content: SYSTEM }, ...history.slice(-12).map((m) => ({ role: m.r === "me" ? "user" : "assistant", content: m.t }))];
  if (S.proxyUrl) {
    const r = await fetch(S.proxyUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: msgs }) });
    if (!r.ok) throw new Error("server " + r.status);
    const j = await r.json(); return j.reply || (j.choices && j.choices[0].message.content);
  }
  const models = await freeModels();
  let lastErr = null;
  for (const model of models.slice(0, 5)) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch(OR + "/chat/completions", { method: "POST", signal: ctl.signal,
        headers: { "Authorization": "Bearer " + S.apiKey, "Content-Type": "application/json", "X-Title": "Buddy English" },
        body: JSON.stringify({ model, messages: msgs, max_tokens: 220, temperature: .7 }) });
      clearTimeout(to);
      if (r.status === 401) throw Object.assign(new Error("key"), { fatal: true });
      if (!r.ok) { lastErr = new Error("http " + r.status); continue; }
      const j = await r.json(); const t = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (t && t.trim()) return t.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    } catch (e) { if (e.fatal) throw e; lastErr = e; }
  }
  throw lastErr || new Error("no model");
}
const QUICK = ["Hello, Buddy!", "Tell me about London", "What do you like?", "Let's play a word game", "Как сказать «я люблю пиццу»?", "Tell me a joke"];
let sending = false;
function renderChat() {
  if (!S.chat.length) S.chat = [{ r: "bot", t: `Woof! Hi${S.name ? ", " + S.name : ""}! I am Buddy 🐶 Let's talk in English! How are you today? (Как у тебя дела сегодня?)` }];
  const ready = S.apiKey || S.proxyUrl;
  view.innerHTML = `<div class="inner" style="padding-bottom:80px">
    <div class="glass card row" style="flex-wrap:nowrap"><div style="width:76px;flex:none">${buddyArt({ mood: "happy", outfit: S.outfit })}</div><div><h2>Болтаем с Бадди</h2><small class="muted">Пиши по-английски или спрашивай по-русски. Нажми 🔊, чтобы послушать.</small></div></div>
    ${ready ? "" : `<div class="glass card"><b>Бадди пока не умеет говорить 🙊</b><p class="muted" style="margin:6px 0 10px">Попроси учителя или родителя вставить бесплатный ключ OpenRouter во вкладке «Я» → «ИИ-собеседник».</p><button class="btn blue sm" id="toMe">Открыть настройки</button></div>`}
    <div class="chat" id="chat">${S.chat.map(msgHTML).join("")}</div>
    <div class="quick" id="quick">${QUICK.map((q) => `<button>${esc(q)}</button>`).join("")}</div>
  </div>
  <form class="composer glass" id="cf"><input id="ci" maxlength="300" placeholder="${ready ? "Напиши Бадди…" : "Нужен ключ ИИ"}" ${ready ? "" : "disabled"} autocomplete="off"><button class="btn sm" ${ready ? "" : "disabled"} aria-label="Отправить">➤</button></form>`;
  const tm = $("#toMe"); tm && (tm.onclick = () => go("me"));
  bindSpeak();
  view.scrollTop = view.scrollHeight;
  $("#cf").onsubmit = (e) => { e.preventDefault(); send($("#ci").value); };
  view.querySelectorAll("#quick button").forEach((b) => b.onclick = () => ready ? send(b.textContent) : go("me"));
}
function msgHTML(m) { return `<div class="msg ${m.r}">${esc(m.t)}${m.r === "bot" ? `<button class="s" data-say="${esc(m.t)}" aria-label="Послушать">🔊</button>` : ""}</div>`; }
function bindSpeak() { view.querySelectorAll("[data-say]").forEach((b) => b.onclick = () => speak(b.dataset.say)); }
async function send(text) {
  text = String(text || "").trim(); if (!text || sending) return;
  sending = true; S.chat.push({ r: "me", t: text }); save(); bumpQuest("chat");
  const chat = $("#chat"); chat.insertAdjacentHTML("beforeend", msgHTML({ r: "me", t: text }) + `<div class="msg bot typing" id="typing"><span></span><span></span><span></span></div>`);
  $("#ci").value = ""; view.scrollTop = view.scrollHeight;
  try {
    const reply = await askBuddy(S.chat);
    S.chat.push({ r: "bot", t: reply }); if (S.chat.length > 60) S.chat = S.chat.slice(-60); save();
    sfx.woof();
  } catch (e) {
    S.chat.push({ r: "bot", t: e.fatal ? "Ой! Ключ OpenRouter не подходит. Попроси взрослого проверить его во вкладке «Я». 🐾" : "Woof… Бадди задумался и не смог ответить. Бесплатные модели иногда заняты — попробуй ещё раз через минутку. 🐾" });
    save();
  }
  sending = false;
  if (current_tab === "chat") renderChat();
}

/* ================= навигация ================= */
let current_tab = "learn";
window.addEventListener("buddy-art-ready", () => { if (!L) render(); });
function go(tab) {
  current_tab = tab;
  document.querySelectorAll("nav.tabs button").forEach((b) => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  render(); view.scrollTop = 0;
}
function render() { ({ learn: renderLearn, chat: renderChat, quests: renderQuests, shop: renderShop, me: renderMe })[current_tab](); paintTop(); }
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => { sfx.tap(); go(b.dataset.tab); }));
$("#pCat").onclick = () => go("shop");
$("#pHeart").onclick = () => { refillHearts(); if (S.hearts < MAX_HEARTS) { const m = HEART_MIN - Math.floor((Date.now() - S.heartsAt) / 60000) % HEART_MIN; toast(`Следующее ❤️ через ${m} мин. Или сделай повторение!`); } else toast("Сердечек полно! ❤️"); };
$("#pBone").onclick = () => toast(S.lastDay === dayKey() ? `Сегодняшняя косточка уже твоя! Серия: ${S.streak} 🦴` : "Пройди урок сегодня, чтобы получить косточку 🦴");

/* ================= знакомство ================= */
function onboarding() {
  const o = document.createElement("div"); o.className = "onb";
  o.innerHTML = `<div class="hero">${buddyArt({ mood: "cheer" })}</div><h1>Hi! I'm Buddy!</h1>
    <p class="muted" style="max-width:340px;margin:0">Я щенок из Лондона. Давай вместе учить английский — по чуть-чуть каждый день!</p>
    <label class="field" style="width:min(360px,100%);text-align:left"><span>Как тебя зовут?</span><input id="on" maxlength="20" placeholder="Твоё имя"></label>
    <div class="goals">${[[1, "🐾 Спокойно", "1 урок в день"], [2, "🐶 Нормально", "2 урока в день"], [3, "🚀 Серьёзно", "3 урока в день"]].map(([g, n, d]) => `<button class="choice ${g === 2 ? "sel" : ""}" data-g="${g}"><b>${n}</b> <span class="muted">· ${d}</span></button>`).join("")}</div>
    <button class="btn wide orange" style="max-width:360px" id="ogo">Поехали!</button>`;
  document.body.appendChild(o); sfx.woof();
  let goal = 2;
  o.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => { o.querySelectorAll("[data-g]").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); goal = +b.dataset.g; sfx.tap(); });
  $("#ogo").onclick = () => { S.name = $("#on").value.trim(); S.goal = goal; save(); o.remove(); confetti(80); render(); };
}

/* ================= старт ================= */
try { const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#f7f5f0"); tg.setBackgroundColor && tg.setBackgroundColor("#f7f5f0"); } } catch (e) { /* не в Telegram */ }
addEventListener("load", () => { try { const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); } } catch (e) { /* нет */ } });
if ("speechSynthesis" in window) speechSynthesis.getVoices();
const st = checkStreak();
render();
if (!S.lessons && !S.name) onboarding();
else if (st && st.saved) setTimeout(() => { modal(`<div style="width:120px">${A("cat-full", "big")}</div><h2>Котик спас твою серию!</h2><p class="muted">${st.used.join(" и ")} ${st.used.length > 1 ? "сторожили" : "сторожил"} твои косточки, пока тебя не было. Серия: ${S.streak} ${A("bone")}</p><button class="btn wide violet" data-a="ok">Спасибо, котик!</button>`, (m, c) => m.querySelector("[data-a]").onclick = c); paintTop(); }, 400);
else if (st && !st.saved) setTimeout(() => { modal(`<div class="hero">${buddyArt({ mood: "oops" })}</div><h2>Серия прервалась</h2><p class="muted">Было ${st.lost} ${plural(st.lost, "день", "дня", "дней")} подряд. Ничего страшного — начнём новую! Совет: купи котика-хранителя в магазине ${A("cat")}</p><button class="btn wide" data-a="ok">Начать новую серию</button>`, (m, c) => m.querySelector("[data-a]").onclick = c); }, 400);
setInterval(paintTop, 60000);
})();
</script>
