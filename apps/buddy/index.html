<style>
/* «Liquid White»: белое жидкое стекло, чёрные кнопки, полированное золото. */
:root {
  color-scheme: light;
  --bg: #f7f5f0; --bg2: #ebe5d8;
  --ink: #141414; --muted: #6f6a62; --faint: #a8a298; --line: rgba(20,20,20,.1);
  --honey: #d6b15e; --honey-d: #9c7731; --gold-t: #f3e3b0;
  --green: #3fae7c; --green-d: #2b8a5f; --green-bg: #e3f4ea;
  --red: #e0675c; --red-d: #b84a40; --red-bg: #fbe7e4;
  --black: #1a1a1c;
  --gold-grad: linear-gradient(100deg, #f3e3b0 0%, #d6b15e 38%, #9c7731 70%, #e6c97f 100%);
  --lock: #e4dfd4; --lock-d: #cbc3b3;
  --f: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --spring: cubic-bezier(.3,1.35,.5,1); --ease: cubic-bezier(.22,1,.36,1);
  --tabs-h: 78px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--f); font-weight: 600; color: var(--ink); font-size: 16px; line-height: 1.4;
  background: radial-gradient(120% 70% at 50% -10%, #ffffff 0%, var(--bg) 45%, var(--bg2) 100%) fixed, var(--bg);
  overflow: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 3px; border-radius: 14px; }
[hidden] { display: none !important; }
.ea { display: inline-block; width: 1.3em; height: 1.3em; object-fit: contain; vertical-align: -.28em; -webkit-user-drag: none; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(40,30,10,.18)); }
.ea.big { width: 62%; height: auto; aspect-ratio: 1; vertical-align: middle; filter: drop-shadow(0 12px 14px rgba(40,30,10,.22)); }
.ea.fill { width: 100%; height: auto; aspect-ratio: 1; vertical-align: middle; }
.emo { display: inline-block; line-height: 1; }

.blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .55; animation: drift 24s ease-in-out infinite alternate; }
.blobs i:nth-child(1) { width: 60vmax; height: 60vmax; left: -25vmax; top: -20vmax; background: #ead7a6; }
.blobs i:nth-child(2) { width: 45vmax; height: 45vmax; right: -20vmax; top: 25vh; background: #ffffff; animation-delay: -8s; }
.blobs i:nth-child(3) { width: 40vmax; height: 40vmax; left: 5vmax; bottom: -22vmax; background: #d9c39a; opacity: .35; animation-delay: -14s; }
@keyframes drift { to { transform: translate(5vmax, 4vmax) scale(1.1); } }

.glass {
  background: linear-gradient(150deg, rgba(255,255,255,.8), rgba(255,255,255,.48));
  -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  border: 1.5px solid rgba(255,255,255,.9); border-radius: 26px;
  box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 18px 40px -22px rgba(40,30,10,.35);
}

/* ---------- каркас ---------- */
#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.top {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 4px;
  margin: max(10px, env(safe-area-inset-top, 0px)) auto 0; width: min(560px, calc(100% - 20px));
  padding: 4px 6px; border-radius: 999px; position: relative; z-index: 5;
}
.pill { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 4px 10px; border-radius: 999px; font-weight: 900; font-size: 1rem; font-variant-numeric: tabular-nums; transition: transform .4s var(--spring); }
.pill:active { transform: scale(.92); }
.pill .e { font-size: 1.25rem; line-height: 1; }
.pill.bump { animation: bump .6s var(--spring); }
@keyframes bump { 40% { transform: scale(1.35) rotate(-6deg); } }
.pill.cookie { color: var(--honey-d); } .pill.heart { color: var(--red-d); } .pill.cat { color: #6e5320; }
.pill.dim .e { filter: grayscale(.9); opacity: .55; }

main.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabs-h) + 40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.inner { width: min(560px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.inner.enter { animation: viewIn .38s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } }

nav.tabs {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 20px));
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 30px;
}
nav.tabs button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 54px; padding: 6px 2px; border-radius: 22px; font-size: .68rem; font-weight: 900; color: var(--muted); transition: background .25s, color .25s, transform .35s var(--spring); }
nav.tabs button .e { font-size: 1.45rem; line-height: 1.1; filter: grayscale(.4); transition: transform .4s var(--spring), filter .2s; }
nav.tabs button[aria-current="page"] { background: #141414; color: var(--gold-t); }
nav.tabs button[aria-current="page"] .e { transform: scale(1.18) translateY(-2px); filter: none; }
nav.tabs button:active { transform: scale(.9); }
nav.tabs .dot { position: absolute; top: 4px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: .66rem; line-height: 18px; box-shadow: 0 0 0 2px #fff; animation: pop .4s var(--spring); }

/* ---------- кнопки ---------- */
.btn {
  --c: var(--black); --d: #000;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 18px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 82%, white), var(--c)); color: #fff; font-weight: 900; font-size: 1.05rem; letter-spacing: .02em;
  box-shadow: 0 5px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.35); transition: transform .08s, box-shadow .08s, filter .2s; text-shadow: 0 1px 0 rgba(0,0,0,.12);
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d), inset 0 2px 0 rgba(255,255,255,.35); }
.btn.wide { width: 100%; }
.btn.green { --c: var(--green); --d: var(--green-d); }
.btn.red { --c: var(--red); --d: var(--red-d); }
.btn.honey { --d: var(--honey-d); background: var(--gold-grad); color: #17130b; text-shadow: none; }
.btn.ghost { background: rgba(255,255,255,.8); color: var(--ink); box-shadow: 0 4px 0 rgba(20,20,20,.1); border: 2px solid var(--line); text-shadow: none; }
.btn.ghost:active { box-shadow: 0 1px 0 rgba(20,20,20,.1); }
.btn:disabled { --c: var(--lock); --d: var(--lock-d); background: var(--lock); color: var(--faint); pointer-events: none; text-shadow: none; border: 0; }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: .9rem; border-radius: 14px; }
.link { min-height: 44px; padding: 8px 12px; font-weight: 800; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--honey-d); }
.sec-title { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }

.buddy { display: block; width: 100%; height: auto; overflow: visible; }
.buddy-img { object-fit: contain; aspect-ratio: 1; filter: drop-shadow(0 16px 18px rgba(40,30,10,.22)); animation: bdbob 3.4s ease-in-out infinite; -webkit-user-drag: none; }
@keyframes bdbob { 50% { transform: translateY(-4px) rotate(-1.5deg); } }
@keyframes hop { to { transform: translateY(-8px); } }

/* ---------- главная ---------- */
.hello { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; padding: 14px; }
.hello .t { font-weight: 800; font-size: .95rem; }
.ring { position: relative; width: 62px; height: 62px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .bgc { stroke: rgba(20,20,20,.08); }
.ring .fgc { stroke: url(#gGold); transition: stroke-dashoffset 1s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82rem; font-weight: 900; line-height: 1; text-align: center; }
.ring small { display: block; font-size: .56rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.train { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.train button { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px; min-height: 64px; border-radius: 22px; text-align: left; font-weight: 800; font-size: .92rem; line-height: 1.2; transition: transform .12s; }
.train button:active { transform: scale(.96); }
.train button .e { font-size: 1.9rem; flex: none; }
.train small { display: block; color: var(--muted); font-weight: 700; font-size: .75rem; }
.badge { position: absolute; top: -6px; right: -4px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--red); color: #fff; font-size: .78rem; font-weight: 900; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; }

.unit { display: flex; flex-direction: column; }
.unit-head { position: relative; overflow: hidden; padding: 16px 16px 14px 18px; border-radius: 26px; color: #fff; background: linear-gradient(135deg, color-mix(in srgb, var(--u) 86%, white), var(--u)); box-shadow: 0 6px 0 color-mix(in srgb, var(--u) 65%, black), 0 18px 30px -16px var(--u); display: grid; grid-template-columns: 1fr 76px; gap: 10px; align-items: center; }
.unit-head::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 90% at 15% 0%, rgba(255,255,255,.35), transparent 55%); pointer-events: none; }
.unit-head .uemo { font-size: 3.4rem; line-height: 1; text-align: center; }
.unit-head .uemo .ea { width: 76px; height: 76px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.3)); }
.unit-head small { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; opacity: .85; font-weight: 900; }
.unit-head h2 { font-size: 1.2rem; margin: 2px 0 8px; }
.ubar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
.ubar i { display: block; height: 100%; border-radius: inherit; background: var(--gold-grad); transition: width .8s var(--ease); }
.unit-head .uact { display: flex; gap: 8px; margin-top: 10px; position: relative; z-index: 1; }
.unit-head .uact button { min-height: 36px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); font-weight: 800; font-size: .8rem; color: #fff; }
.unit-head.locked { --u: #bdb4a3 !important; }
.unit-head.locked .uemo .ea { filter: grayscale(1) opacity(.6); }
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 62px 0 18px; }
.node-wrap { position: relative; width: 84px; height: 78px; transition: transform .4s var(--ease); }
.node {
  --c: #2a2a2e; --sh: #000; position: absolute; inset: 0; border-radius: 50%; font-size: 2.1rem; display: grid; place-items: center;
  background: radial-gradient(80% 70% at 35% 25%, rgba(255,255,255,.45), transparent 55%), var(--c);
  box-shadow: 0 8px 0 var(--sh), inset 0 -5px 10px rgba(0,0,0,.14); transition: transform .1s, box-shadow .1s;
}
.node .ic .ea { width: 44px; height: 44px; }
.node:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--sh); }
.node.done { --c: #d6b15e; --sh: #9c7731; color: #fff; }
.node.done svg { width: 38px; height: 38px; }
.node.locked { --c: var(--lock); --sh: var(--lock-d); }
.node.locked .ic { opacity: .55; filter: grayscale(1); }
.node.locked .ic .ea { width: 34px; height: 34px; }
.node.current { --c: #1a1a1c; --sh: #000; }
.node.current::before { content: ""; position: absolute; inset: -11px; border-radius: 50%; border: 5px solid rgba(214,177,94,.65); animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 50% { transform: scale(1.08); opacity: .45; } }
.node .crown { position: absolute; right: -6px; bottom: -6px; font-size: 1.15rem; }
.start-bubble { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 9px 16px; border-radius: 14px; background: #fff; color: var(--ink); border: 2px solid var(--line); font-weight: 900; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; animation: float 1.8s ease-in-out infinite; pointer-events: none; z-index: 2; }
.start-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; }
@keyframes float { 50% { transform: translate(-50%, -5px); } }
.path-buddy { position: absolute; width: 92px; top: -12px; pointer-events: none; }
.lpop { width: min(330px, 100%); padding: 16px; border-radius: 22px; background: #141414; color: #fff; position: relative; animation: popIn .32s var(--spring); margin-top: -4px; z-index: 3; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 40px -18px rgba(0,0,0,.6); }
.lpop::before { content: ""; position: absolute; bottom: 100%; left: calc(50% + var(--ox, 0px) - 10px); border: 10px solid transparent; border-bottom-color: #141414; }
.lpop h3 { color: var(--gold-t); }
.lpop p { color: rgba(255,255,255,.72); font-size: .9rem; }
.lpop .btn { --c: #fff; --d: #c9c2b2; color: #141414; background: #fff; text-shadow: none; }
.lpop .btn.honey { background: var(--gold-grad); }
@keyframes popIn { from { transform: scale(.85) translateY(-8px); opacity: 0; } }
.fact-card { padding: 14px 16px; display: flex; gap: 12px; align-items: center; margin-top: 4px; }
.fact-card .flag { width: 46px; flex: none; }
.fact-card .flag .ea { width: 46px; height: 46px; }
.course-end { padding: 22px 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.to-cur { position: fixed; z-index: 18; right: max(16px, calc(50% - 270px)); bottom: calc(var(--tabs-h) + 22px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #141414; color: var(--gold-t); box-shadow: 0 5px 0 #000, 0 14px 24px -10px rgba(0,0,0,.5); animation: popIn .3s var(--spring); }
.to-cur svg { width: 26px; height: 26px; transition: transform .3s; }
.to-cur.up svg { transform: rotate(180deg); }

/* ---------- урок ---------- */
.lesson { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% -10%, #ffffff 0%, var(--bg) 50%, var(--bg2) 100%); animation: slideup .45s var(--ease); }
.lesson.out { animation: slidedown .3s var(--ease) forwards; }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
@keyframes slidedown { to { transform: translateY(40px); opacity: 0; } }
.l-top { display: flex; align-items: center; gap: 10px; width: min(620px, calc(100% - 24px)); margin: max(12px, env(safe-area-inset-top, 0px)) auto 0; }
.l-close { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--faint); flex: none; }
.l-close svg { width: 22px; height: 22px; }
.bar { flex: 1; height: 18px; border-radius: 999px; background: rgba(20,20,20,.08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--gold-grad); box-shadow: inset 0 4px 0 rgba(255,255,255,.4); transition: width .5s var(--spring); min-width: 18px; }
.l-hearts { font-weight: 900; color: var(--red-d); display: flex; align-items: center; gap: 4px; min-width: 44px; justify-content: flex-end; }
.l-hearts.bump { animation: bump .6s var(--spring); }
.l-mode { text-align: center; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 900; color: var(--honey-d); margin-top: 6px; }
.l-body { flex: 1; min-height: 0; overflow-y: auto; width: min(620px, 100%); margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.l-body.in > * { animation: taskIn .38s var(--ease) both; }
.l-body.in > *:nth-child(2) { animation-delay: .04s; } .l-body.in > *:nth-child(3) { animation-delay: .08s; } .l-body.in > *:nth-child(4) { animation-delay: .12s; }
@keyframes taskIn { from { transform: translateX(36px); opacity: 0; } }
.l-title { font-size: clamp(1.25rem, 5.5vw, 1.6rem); }
.tag-new { align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: var(--gold-grad); color: #17130b; font-size: .75rem; letter-spacing: .1em; font-weight: 900; }
.say-row { display: flex; align-items: flex-end; gap: 10px; }
.say-row .mini { width: 92px; flex: none; }
.bubble { position: relative; flex: 1; padding: 14px 16px; border-radius: 20px; border: 2px solid var(--line); background: #fff; font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 18px; border: 10px solid transparent; border-right-color: #fff; border-left: 0; filter: drop-shadow(-2px 0 0 var(--line)); }
.bubble .ea.word { width: 54px; height: 54px; }
.speak { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--black); color: #fff; box-shadow: 0 4px 0 #000; vertical-align: middle; flex: none; transition: transform .08s; }
.speak:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.speak svg { width: 24px; height: 24px; }
.speak.big { width: 104px; height: 104px; border-radius: 30px; }
.speak.big svg { width: 54px; height: 54px; }
.speak.slow { background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); width: 64px; height: 64px; border-radius: 20px; font-size: 2rem; }
.speak.playing { animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.06); } }
.listen-row { display: flex; justify-content: center; gap: 14px; align-items: center; }
.listen-row .mini { width: 92px; }

.choices { display: grid; gap: 10px; }
.choices.pics { grid-template-columns: 1fr 1fr; }
.choice { min-height: 60px; padding: 12px 16px; border-radius: 18px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-weight: 800; font-size: 1.1rem; text-align: left; transition: transform .1s, border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; }
.choice .k { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: var(--faint); }
.choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choice.sel { border-color: #141414; background: #f6f1e4; box-shadow: 0 4px 0 #d6c9a8; }
.choice.sel .k { border-color: #141414; color: var(--ink); }
.choice.ok { border-color: var(--green); background: var(--green-bg); box-shadow: 0 4px 0 #9fe4c3; color: var(--green-d); }
.choice.bad { border-color: var(--red); background: var(--red-bg); box-shadow: 0 4px 0 #f6b0b7; color: var(--red-d); }
.choice.gone { opacity: .25; pointer-events: none; transform: scale(.94); }
.choice.pic { aspect-ratio: 1 / .92; display: grid; place-items: center; text-align: center; padding: 6px; font-size: 3.6rem; }
.match .choice { justify-content: center; text-align: center; font-size: 1rem; }

.intro-card { padding: 26px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.intro-card .pic { width: min(200px, 52vw); font-size: 6rem; line-height: 1.1; animation: popIn .6s var(--spring); }
.intro-card .pic .ea.big { width: 100%; }
.intro-card .en { font-family: var(--f-display); font-size: 2.1rem; font-weight: 700; color: var(--ink); }
.intro-card .ru { font-size: 1.2rem; color: var(--muted); }

const wt = (t, w, u) => ({ t, w, pool: u.words, u: u.id });

const MIX = ["pic", "en2ru", "type", "listen", "ru2en", "type"];
function makeLesson(ui, k) {
  if (ui === -1) { // повторение пройденного
    const units = C.filter((u, i) => unitOpen(i) && (S.progress[u.id] || 0) > 0);
    const src = units.length ? units : [C[0]];
    const T = [];
    for (let i = 0; i < 8; i++) { const u = rnd(src), w = rnd(u.words.slice(0, units.length ? 8 : 4)); T.push(wt(MIX[i % MIX.length], w, u)); }
    const u = rnd(src); T.push({ t: "match", pairs: pick(u.words, 4), u: u.id }, pt("build", rnd(u.phrases), u));
    return shuffle(T);
  }
  if (ui === -2) { // работа над ошибками
    const items = mistakeItems().sort((a, b) => b.n - a.n || b.t - a.t).slice(0, 8);
    const T = [];
    const forms = ["type", "pic", "ru2en", "listen"];
    items.forEach((it, i) => {
      if (it.kind === "w") T.push(wt(forms[i % forms.length], it.item, it.u));
      else T.push(pt(i % 2 ? "lbuild" : "build", it.item, it.u));
    });
    if (T.length < 5) items.forEach((it, i) => { if (it.kind === "w") T.push(wt(forms[(i + 1) % forms.length], it.item, it.u)); else T.push({ t: "pchoose", p: it.item, all: it.u.phrases, u: it.u.id }); });
    return T;
  }
  const u = C[ui], W = u.words, P = u.phrases;
  if (k === 0 || k === 1) {
    const ws = W.slice(k * 4, k * 4 + 4);
    return [
      { t: "intro", w: ws[0] }, { t: "intro", w: ws[1] }, wt("pic", ws[0], u), wt("pic", ws[1], u),
      { t: "intro", w: ws[2] }, { t: "intro", w: ws[3] }, wt("en2ru", ws[2], u), wt("listen", ws[3], u),
      wt("ru2en", ws[0], u), { t: "match", pairs: ws, u: u.id }, wt("pic", ws[2], u), wt("type", ws[1], u), wt("ru2en", ws[3], u)
    ];
  }
  if (k === 2) {
    const ps = shuffle(P);
    return [
      pt("pchoose", ps[0], u), pt("build", ps[0], u), pt("build", ps[1], u), pt("pchoose", ps[2], u),
      pt("lbuild", ps[1], u), pt("build", ps[2], u), pt("build", ps[3], u), pt("lbuild", ps[4], u),
      { t: "match", pairs: pick(W, 4), u: u.id }
    ];
  }
  const ws = pick(W, k === 3 ? 5 : 6);
  const T = [
    ...ws.map((w, i) => wt(MIX[i % MIX.length], w, u)),
    { t: "match", pairs: pick(W, 4), u: u.id },
    ...pick(P, k === 3 ? 2 : 3).map((p, i) => pt(i % 2 ? "lbuild" : "build", p, u)),
    pt("pchoose", rnd(P), u), wt("type", rnd(W.filter((w) => !ws.includes(w))), u)
  ];
  return shuffle(T);
}

function finishLesson() {
  const mode = L.ui === -1 ? "practice" : L.ui === -2 ? "review" : "unit";
  const perfect = L.wrong === 0, secs = Math.round((Date.now() - L.t0) / 1000);
  const ui = L.ui, k = L.k, u = ui >= 0 ? C[ui] : null;
  const firstTime = u && (S.progress[u.id] || 0) === k;
  const xp = mode === "unit" ? (firstTime ? 10 + (k === 4 ? 10 : 0) : 5) + (perfect ? 5 : 0) : 8 + L.fixedNow * 2;
  const cookies = mode === "unit" ? 5 + (perfect ? 5 : 0) + (firstTime && k === 4 ? 20 : 0) : 10;
  const acc = Math.round(L.total / Math.max(1, L.total + L.wrong) * 100);
  S.xp += xp; S.cookies += cookies; S.lessons++;
  if (perfect && mode === "unit") S.perfect++;
  if (mode !== "unit") { S.hearts = Math.min(MAX_HEARTS, S.hearts + 1); bumpQuest("practice"); }
  let unitFinished = false;
  if (u) {
    if (firstTime) { S.progress[u.id] = k + 1; unitFinished = k === 4; }
    if (k <= 1) u.words.slice(k * 4, k * 4 + 4).forEach((w) => { if (!S.learned.includes(w[0])) S.learned.push(w[0]); });
  }
  bumpQuest("lessons"); bumpQuest("xp", xp); if (perfect) bumpQuest("perfect");
  const goal = S.goal || 2, before = dailyN(); S.daily.n = before + 1;
  const goalNow = before < goal && S.daily.n >= goal; if (goalNow) { S.cookies += 10; bumpQuest("goal"); }
  const today = dayKey(), newDay = S.lastDay !== today;
  if (newDay) { S.streak++; S.lastDay = today; S.bestStreak = Math.max(S.bestStreak, S.streak); S.days = [...S.days.filter((d) => d !== today), today].slice(-21); }
  save();
  const typed = L.typed, fixedNow = L.fixedNow, maxCombo = L.maxCombo;
  endLesson(true);
  sfx.win(); vibe("win"); setTimeout(() => confetti(), 200);

  const screens = [];
  screens.push({
    html: `<div class="hero">${buddyArt({ mood: "cheer", outfit: S.outfit })}</div>
      <h1>${mode === "review" ? "Ошибки исправлены!" : mode === "practice" ? "Повторение — мать учения!" : perfect ? "Без единой ошибки!" : "Урок пройден!"}</h1>
      <div class="results"><div style="--c:#141414"><span>Опыт</span><b data-cu="${xp}" data-sf=" XP">0</b></div><div style="--c:var(--honey-d)"><span>Точность</span><b data-cu="${acc}" data-sf="%">0</b></div><div style="--c:var(--green-d)"><span>Время</span><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</b></div></div>
      <div class="row" style="justify-content:center;font-weight:900;font-size:1.1rem">+<span data-cu="${cookies + (goalNow ? 10 : 0)}">0</span> ${A("cookie")}${mode !== "unit" ? `&nbsp;&nbsp;+1 ${A("heart")}` : ""}</div>
      ${goalNow ? `<div class="goal-note">${E("🎯")} Цель дня выполнена! +10 ${A("cookie")}</div>` : ""}
      ${fixedNow ? `<p class="muted">Исправлено ${fixedNow} ${plural(fixedNow, "слово", "слова", "слов")} — так держать!</p>` : maxCombo >= 5 ? `<p class="muted">Рекорд урока: ${maxCombo} ответов подряд ${E("🔥")}</p>` : typed ? `<p class="muted">Написано слов без подсказки: ${typed} ${E("✍️")}</p>` : ""}`,
    onShow: (el) => el.querySelectorAll("[data-cu]").forEach((x) => countUp(x, +x.dataset.cu, 900, x.dataset.sf || ""))
  });
  if (newDay) {
    const wd = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"], now = new Date(), dow = (now.getDay() + 6) % 7;
    const week = wd.map((n, j) => { const d = new Date(now); d.setDate(now.getDate() - dow + j); const kk = dayKey(d); return `<div class="${kk === today ? "today" : ""}"><i class="${S.days.includes(kk) ? "on" : ""}">${S.days.includes(kk) ? CHECK : ""}</i>${n}</div>`; }).join("");
    screens.push({
      html: `<div class="bone-big">${A("bone", "fill")}<b data-cu="${S.streak}">0</b></div>
        <h1>${S.streak === 1 ? "Первая косточка!" : `${S.streak} ${plural(S.streak, "день", "дня", "дней")} подряд!`}</h1>
        <p class="muted">${S.streak === 1 ? "Занимайся каждый день, и серия будет расти. Бадди будет ждать тебя завтра!" : "Серия растёт! Приходи завтра за новой косточкой."}</p>
        <div class="glass week">${week}</div>
        ${!S.cats.length && S.streak >= 2 ? `<p class="muted" style="font-size:.9rem">${A("cat")} Совет: возьми котика-хранителя в магазине — он сбережёт серию, если пропустишь день.</p>` : ""}`,
      onShow: (el) => { sfx.coin(); const b = el.querySelector("[data-cu]"); countUp(b, S.streak, 700); }
    });
  }
  if (unitFinished) {
    const nextU = C[ui + 1];
    screens.push({
      html: `<div class="trophy">${A("trophy", "fill")}</div><div class="eyebrow">Раздел ${ui + 1} пройден</div><h1>${u.title}</h1>
        <div class="word-chips">${u.words.map((w) => `<span>${E(w[2])}${esc(w[0])}</span>`).join("")}</div>
        <div class="glass fact-card" style="text-align:left"><span class="flag">${A(u.flag === "us" ? "flag-us" : "flag-gb")}</span><div><div class="eyebrow">${u.flag === "us" ? "Факт об Америке" : "Факт о Британии"}</div>${u.fact}</div></div>
        ${nextU ? `<div class="goal-note">${A("lock")} → ${E(nextU.emoji)} Открыт раздел «${nextU.title}»</div>` : `<div class="goal-note">${A("crown")} Ты прошёл весь курс!</div>`}
        <p class="muted">+20 ${A("cookie")} за раздел</p>`,
      onShow: () => { sfx.unlock(); setTimeout(() => confetti(160), 200); }
    });
  }
  celebrate(screens, () => { scrollCur = true; go("learn"); paintTop(); bump("#pCookie"); if (newDay) bump("#pBone"); checkAch(); });
}
function celebrate(screens, done) {
  const o = document.createElement("div"); o.className = "cele";
  document.body.appendChild(o);

  const show = () => {
    const s = screens[i];

    setTimeout(() => { const b = o.querySelector("#cnx"); b && b.focus({ preventScroll: true }); }, 60);
  };
  const step = () => { sfx.tap(); i++; if (i < screens.length) show(); else { off && off(); o.remove(); done && done(); } };
  off = onBack(step);
  show();
}

const SYSTEM = `You are Buddy, a kind and cheerful puppy from London who teaches English to Russian-speaking children aged 8-11 (A1 level).
Rules:
- Answer in very simple English, 1-3 short sentences. After hard words add the Russian translation in brackets, e.g. "a bridge (мост)".
- If the child writes in Russian, answer in simple English and add a short Russian translation of your whole answer in brackets.
- Gently correct mistakes: show the correct sentence once, then praise.
- Always end with one easy question to keep the chat going.
- You love tea, London, New York, bones and naps. You are playful and warm, sometimes say "Woof!".
- Do not use markdown, lists or emoji codes. Plain short text only.

async function freeModels() {
  try {
    const c = JSON.parse(localStorage.getItem("buddy-models") || "null");
    if (c && Date.now() - c.t < 864e5 && c.list.length) return c.list;
  } catch (e) { /* нет кэша */ }

    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(OR + "/models", { signal: ctl.signal }); clearTimeout(to); const j = await r.json();
    const free = (j.data || []).filter((m) => (m.id.endsWith(":free") || (m.pricing && +m.pricing.prompt === 0 && +m.pricing.completion === 0)) && (m.context_length || 0) >= 8000 && !/vision|vl|image|audio|embed|guard/i.test(m.id))
      .sort((a, b) => score(b) - score(a)).map((m) => m.id);
    const list = [...new Set([...free.filter((id) => id === "openrouter/free"), ...free, ...FALLBACK_MODELS])].slice(0, 8);
    try { localStorage.setItem("buddy-models", JSON.stringify({ t: Date.now(), list })); } catch (e) { /* без кэша */ }
    return list;
  } catch (e) { return FALLBACK_MODELS; }
  function score(m) { const id = m.id; return (/llama|gemma|mistral|qwen|deepseek/i.test(id) ? 50 : 0) + (/instruct|chat|it/i.test(id) ? 10 : 0) + Math.min(30, (m.context_length || 0) / 4000); }
}

      <div class="glass">${A("bone")}<span><b>Косточки</b><small>Занимайся каждый день — серия растёт</small></span></div>
      <div class="glass">${A("heart")}<span><b>Сердечки</b><small>Ошибся — минус сердечко. Они восстанавливаются</small></span></div>
      <div class="glass">${A("cat")}<span><b>Котики-хранители</b><small>Берегут серию, если пропустишь день</small></span></div>
      <div class="glass">${A("cookie")}<span><b>Печеньки</b><small>Награда за уроки — трать в магазине на наряды</small></span></div></div>`,
      foot: `<button class="btn wide honey" data-n>Начать первый урок!</button><button class="link" data-look>Сначала осмотрюсь</button>` })
  ];
  let off = onBack(() => { if (step > 0) { step--; paint(); } });
  const finish = (lesson) => { off && off(); off = null; S.name = name; S.goal = goal; S.onboarded = true; save(); o.style.transition = "opacity .3s"; o.style.opacity = "0"; setTimeout(() => o.remove(), 300); scrollCur = true; render(true); if (lesson) setTimeout(() => startLesson(0, 0), 150); else confetti(80); };
  const paint = () => {
    const s = steps[step]();
    o.innerHTML = `<div class="onb-top">${step ? `<button class="l-close" id="ob" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>` : `<span style="width:44px"></span>`}<div class="bar"><i style="width:${(step + 1) / N * 100}%"></i></div><span style="width:44px"></span></div>
      <div class="onb-body in">${s.body}</div><div class="onb-foot">${s.foot}</div>`;
    const ob = $("#ob", o); ob && (ob.onclick = () => { sfx.tap(); step--; paint(); });
    const inp = $("#on", o);
    if (inp) { inp.oninput = () => { name = inp.value.trim(); }; inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); nx(); } }; setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) { /* нет */ } }, 400); }
    o.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => { o.querySelectorAll("[data-g]").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); goal = +b.dataset.g; sfx.tap(); vibe(); });
    const nx = () => { sfx.tap(); vibe(); if (inp) name = inp.value.trim(); if (step === 0) sfx.woof(); if (step < N - 1) { step++; paint(); } else finish(true); };
    $("[data-n]", o).onclick = nx;
    const sk = $("[data-skip]", o); sk && (sk.onclick = () => { name = ""; sfx.tap(); step++; paint(); });
    const lk = $("[data-look]", o); lk && (lk.onclick = () => { sfx.tap(); finish(false); });
  };
  paint();
}

/* ================= старт ================= */
function tgInit() { try { const tg = tgApp(); if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#f7f5f0"); tg.setBackgroundColor && tg.setBackgroundColor("#f7f5f0"); tg.BackButton && tg.BackButton.onClick(doBack); syncBack(); } } catch (e) { /* не в Telegram */ } }
tgInit();
addEventListener("load", tgInit);
if ("speechSynthesis" in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { /* нет */ } }
const st = checkStreak();
render();
if (!S.onboarded) onboarding();
else if (st && st.saved) setTimeout(() => { modal(`<div style="width:120px">${A("cat-full", "fill")}</div><h2>Котик спас твою серию!</h2><p class="muted">${st.used.map(esc).join(" и ")} ${st.used.length > 1 ? "сторожили" : "сторожил"} твои косточки, пока тебя не было. Серия: ${S.streak} ${A("bone")}</p><button class="btn wide" data-a="ok">Спасибо, котик!</button>`, (m, c) => m.querySelector("[data-a]").onclick = c); paintTop(); }, 400);
else if (st && !st.saved) setTimeout(() => { modal(`<div class="hero">${buddyArt({ mood: "oops" })}</div><h2>Серия прервалась</h2><p class="muted">Было ${st.lost} ${plural(st.lost, "день", "дня", "дней")} подряд. Ничего страшного — начнём новую! Совет: возьми котика-хранителя в магазине ${A("cat")}</p><button class="btn wide" data-a="ok">Начать новую серию</button>`, (m, c) => m.querySelector("[data-a]").onclick = c); }, 400);
setInterval(() => { if (!document.hidden) paintTop(); }, 60000);
window.__buddyTest = { lesson: () => L, state: () => S }; // для автотестов
document.addEventListener("visibilitychange", () => { if (!document.hidden) { const s2 = checkStreak(); paintTop(); if (s2 && !L) render(); } else { try { speechSynthesis.cancel(); } catch (e) { /* нет */ } } });
})();
</script>
