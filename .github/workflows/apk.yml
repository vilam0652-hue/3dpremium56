name: Сборка APK

on:
  push:
    branches: [main]
    paths: ["apps/**", "shared/**", "android/**", "icons/**", "apps.json", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Подпись APK. Если в Settings → Secrets добавлен свой ключ, используется он.
      # Иначе — общий ключ сборки, который хранится в кэше Actions (чтобы обновления ставились поверх).
      - name: Ключ подписи из секретов
        env:
          KS_B64: ${{ secrets.KAPLYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kaplya.jks"
            echo "KAPLYA_KEYSTORE=$RUNNER_TEMP/kaplya.jks" >> "$GITHUB_ENV"
          fi

      - name: Запасной ключ подписи
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kaplya-debug-keystore-v1

      - name: Сборка всех приложений
        env:
          KAPLYA_KEYSTORE_PASSWORD: ${{ secrets.KAPLYA_KEYSTORE_PASSWORD }}
          KAPLYA_KEY_ALIAS: ${{ secrets.KAPLYA_KEY_ALIAS }}
          KAPLYA_KEY_PASSWORD: ${{ secrets.KAPLYA_KEY_PASSWORD }}
        run: bash android/build-all.sh

      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Все приложения «Капли». Скачай нужный APK на телефон и установи. Сборка №${GITHUB_RUN_NUMBER}."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk dist/*.apk --clobber
            gh release edit apk --notes "$NOTES"
          else
            gh release create apk dist/*.apk --title "Капля — все приложения" --notes "$NOTES" --latest
          fi
