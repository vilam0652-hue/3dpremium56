<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Капля — вход для администратора</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="icons/buddy-96.png">
<link rel="stylesheet" href="shared/k.css">
<script src="shared/k.js"></script>
<script src="site/admin-data.js"></script>
<style>
  body { -webkit-user-select: auto; user-select: auto; }
  .gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .login { width: min(420px, 100%); padding: 34px 28px; border-radius: 30px; display: flex; flex-direction: column; gap: 16px; }
  .login .logo { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid var(--stroke); }
  .login .logo .drop-ico { width: 34px; height: 34px; }
  .login h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; margin: 0; line-height: 1.15; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field span { font-size: .82rem; color: var(--muted); font-weight: 700; }
  .field input { height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--stroke); background: rgba(255,255,255,.04); color: var(--text); font-size: 1rem; outline: none; transition: border-color .2s, background .2s; }
  .field input:focus { border-color: var(--gold); background: rgba(255,255,255,.07); }
  .pw { position: relative; }
  .pw input { width: 100%; padding-right: 92px; }
  .pw button { position: absolute; right: 6px; top: 6px; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.07); color: var(--muted); font-weight: 700; font-size: .85rem; }
  .err { min-height: 1.4em; color: var(--bad); font-weight: 700; font-size: .92rem; margin: 0; }
  .login .btn { width: 100%; }
  .hint { color: var(--faint); font-size: .82rem; margin: 0; }
  .back { color: var(--muted); font-size: .9rem; text-decoration: none; text-align: center; }

  .admin { padding-block: 24px 60px; }
  .admin-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .admin-top h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0; }
  .adm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .adm-wide { grid-column: 1 / -1; }
  @media (max-width: 760px) { .adm-grid { grid-template-columns: 1fr; } }
  .adm-card { padding: 22px; border-radius: 26px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .adm-card h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 0; }
  .adm-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .adm-head .btn { min-height: 40px; padding: 0 16px; font-size: .85rem; }
  .adm-table-wrap { overflow-x: auto; }
  .adm-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .adm-table th { text-align: left; color: var(--muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--stroke); }
  .adm-table td { padding: 10px; border-bottom: 1px solid var(--stroke-lo); white-space: nowrap; }
  .adm-table td.app { display: flex; align-items: center; gap: 10px; }
  .adm-table td.app img { width: 30px; height: 30px; border-radius: 9px; }
  .adm-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .adm-total { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; }
  .adm-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .adm-link { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); text-decoration: none; transition: border-color .2s, background .2s; }
  .adm-link:hover { border-color: var(--stroke-c); background: rgba(255,255,255,.07); }
  .adm-link b { font-size: .95rem; } .adm-link span { color: var(--muted); font-size: .8rem; }
  .adm-steps, .adm-check { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #d7d2c8; font-weight: 500; }
  .adm-check a { color: var(--gold-hi); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="login glass" id="loginForm" autocomplete="on">
    <div class="logo" id="logo"></div>
    <div><span class="eyebrow">Капля</span><h1>Вход для администратора</h1></div>
    <label class="field"><span>Логин</span><input id="login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field"><span>Пароль</span><span class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="showPw" aria-label="Показать пароль">Показать</button></span></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn big" id="go" type="submit">Войти</button>
    <p class="hint">Панель зашифрована. Без верных логина и пароля её содержимое не открыть, даже заглянув в код сайта.</p>
    <a class="back" href="./">← На главную</a>
  </form>
</div>
<main class="wrap admin" id="admin" hidden></main>

<script>
(() => {
  document.getElementById("logo").innerHTML = K.dropSVG();
  const $ = (id) => document.getElementById(id);
  const seg = location.hostname.endsWith("github.io") ? location.pathname.split("/").filter(Boolean)[0] : null;
  const REPO = "vilam0652-hue/" + (seg || "3dpremium56");
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let fails = 0, lockUntil = 0;

  $("showPw").onclick = () => { const p = $("password"); p.type = p.type === "password" ? "text" : "password"; $("showPw").textContent = p.type === "password" ? "Показать" : "Скрыть"; };

  async function decrypt(login, password) {
    const B = window.ADMIN_BLOB, enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(login.trim() + "\u0000" + password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(B.salt), iterations: B.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(B.iv) }, key, fromB64(B.ct)));
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.ADMIN_BLOB || !window.crypto || !crypto.subtle) { $("err").textContent = "Этот браузер не поддерживает защищённый вход. Открой сайт по https в Chrome."; return; }
    const wait = Math.ceil((lockUntil - Date.now()) / 1000);
    if (wait > 0) { $("err").textContent = `Слишком много попыток. Подожди ${wait} с.`; return; }
    $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Проверяю…";
    try {
      const html = await decrypt($("login").value, $("password").value);
      fails = 0; openPanel(html);
    } catch (err) {
      fails++; if (fails >= 3) lockUntil = Date.now() + Math.min(60, 5 * 2 ** (fails - 3)) * 1000;
      $("err").textContent = "Неверный логин или пароль."; $("password").select();
    } finally { $("go").disabled = false; $("go").textContent = "Войти"; }
  });

  function openPanel(html) {
    $("gate").hidden = true;
    const a = $("admin");
    a.innerHTML = `<div class="admin-top"><div><span class="eyebrow">Администратор</span><h1>Панель «Капли»</h1></div><div class="row"><a class="btn ghost" href="./">Сайт</a><button class="btn ghost" id="logout">Выйти</button></div></div>${html}`;
    a.hidden = false;
    $("logout").onclick = () => { a.innerHTML = ""; a.hidden = true; $("gate").hidden = false; $("password").value = ""; };
    a.querySelectorAll("[data-gh]").forEach((l) => (l.href = `https://github.com/${REPO}${l.dataset.gh}`));
    const r = $("admRefresh"); if (r) r.onclick = loadStats;
    loadStats();
  }

  const NAMES = { bust: "3D Bust", buddy: "Бадди — английский", merge: "Фруктовое слияние", space: "Звёздный рейс", balloons: "Шарики-примеры", breakout: "Стеклобой", multiply: "Таблица-Турбо", words: "Грамотей", world: "Знайка", grades: "Мои оценки" };
  async function loadStats() {
    const body = document.querySelector("#admStats tbody"); if (!body) return;
    body.innerHTML = `<tr><td colspan="4" class="muted">Загружаю…</td></tr>`;
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/releases/tags/apk`, { headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(res.status === 403 ? "GitHub временно ограничил запросы. Попробуй через час." : "Релиз не найден (" + res.status + ")");
      const rel = await res.json();
      const rows = rel.assets.map((x) => ({ id: x.name.replace(/^kaplya-|\.apk$/g, ""), n: x.download_count, mb: (x.size / 1048576).toFixed(1), at: new Date(x.updated_at) })).sort((a, b) => b.n - a.n);
      body.innerHTML = rows.map((x) => `<tr><td class="app"><img src="icons/${x.id}-96.png" alt="">${NAMES[x.id] || x.id}</td><td class="num">${x.n}</td><td class="num">${x.mb} МБ</td><td>${x.at.toLocaleDateString("ru-RU")}</td></tr>`).join("");
      $("admTotal").textContent = "Всего скачиваний: " + rows.reduce((s, x) => s + x.n, 0);
    } catch (err) { body.innerHTML = `<tr><td colspan="4" class="muted">${err.message}</td></tr>`; }
  }
})();
</script>
</body>
</html>
